    'E':[31,16,16,30,16,16,31], 'F':[31,16,16,30,16,16,16], 'G':[14,17,16,23,17,17,15], 'H':[17,17,17,31,17,17,17],
    'I':[14,4,4,4,4,4,14], 'J':[7,2,2,2,2,18,12], 'K':[17,18,20,24,20,18,17], 'L':[16,16,16,16,16,16,31],
    'M':[17,27,21,21,17,17,17], 'N':[17,17,25,21,19,17,17], 'O':[14,17,17,17,17,17,14], 'P':[30,17,17,30,16,16,16],
    'Q':[14,17,17,17,21,18,13], 'R':[30,17,17,30,20,18,17], 'S':[15,16,16,14,1,1,30], 'T':[31,4,4,4,4,4,4],
    'U':[17,17,17,17,17,17,14], 'V':[17,17,17,17,17,10,4], 'W':[17,17,17,21,21,21,10], 'X':[17,17,10,4,10,17,17],
    'Y':[17,17,10,4,4,4,4], 'Z':[31,1,2,4,8,16,31],
    ' ':[0,0,0,0,0,0,0], ':':[0,12,12,0,12,12,0], '.':[0,0,0,0,0,12,12], ',':[0,0,0,0,12,4,8],
    '-':[0,0,0,31,0,0,0], '+':[0,4,4,31,4,4,0], '=':[0,0,31,0,31,0,0], '!':[4,4,4,4,4,0,4],
    '?':[14,17,1,2,4,0,4], '/':[0,1,2,4,8,16,0], "'":[4,4,8,0,0,0,0], '(':[2,4,8,8,8,4,2],
    ')':[8,4,2,2,2,4,8], '·':[0,0,0,12,12,0,0], '×':[0,17,10,4,10,17,0],
    '−':[0,0,0,31,0,0,0], '÷':[0,4,0,31,0,4,0], '<':[2,4,8,16,8,4,2], '>':[8,4,2,1,2,4,8],
    '↑':[4,14,21,4,4,4,4], '↓':[4,4,4,4,21,14,4], '←':[0,4,8,31,8,4,0], '→':[0,4,2,31,2,4,0],
    '—':[0,0,0,31,0,0,0], '&':[12,18,20,8,21,18,13],
  };
  // Condensed 3x7 digits/operators (3-bit rows) for long cell text, e.g. "100÷10".
  // Same height as FONT, so a condensed cell lines up with its neighbours.
  const FONT_C = {
    '0':[7,5,5,5,5,5,7], '1':[2,6,2,2,2,2,7], '2':[7,1,1,7,4,4,7], '3':[7,1,1,7,1,1,7],
    '4':[5,5,5,7,1,1,1], '5':[7,4,4,7,1,1,7], '6':[7,4,4,7,5,5,7], '7':[7,1,1,2,2,2,2],
    '8':[7,5,5,7,5,5,7], '9':[7,5,5,7,1,1,7],
    '+':[0,0,2,7,2,0,0], '−':[0,0,0,7,0,0,0], '-':[0,0,0,7,0,0,0], '×':[0,0,5,2,5,0,0], '÷':[0,2,0,7,0,2,0],
  };
  const glyph = (ch, condensed) => condensed && FONT_C[ch]
    ? { g: FONT_C[ch], w: 3 } : { g: FONT[ch] || FONT['?'], w: 5 };
  function textWidth(str, scale = 1, condensed = false) {
    let w = 0;
    for (const ch of String(str).toUpperCase()) w += glyph(ch, condensed).w + 1;
    return w ? (w - 1) * scale : 0;
  }

  // target: the 2D context to draw on (the game canvas unless given)
  function text(str, x, y, color, scale = 1, align = 'left', condensed = false, target = ctx) {
    str = String(str).toUpperCase();
    if (align === 'center') x -= Math.floor(textWidth(str, scale, condensed) / 2);
    else if (align === 'right') x -= textWidth(str, scale, condensed);
    target.fillStyle = color;
    for (const ch of str) {
      const { g, w } = glyph(ch, condensed);
      for (let r = 0; r < 7; r++) {
        const bits = g[r];
        if (!bits) continue;
        for (let c = 0; c < w; c++) if (bits & (1 << (w - 1 - c))) target.fillRect(x + c * scale, y + r * scale, scale, scale);
      }
      x += (w + 1) * scale;
    }
  }

  // Pixel-font text on its own small canvas (touch button labels), `scale` CSS px per font pixel.
  function label(str, color, scale = 2) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, textWidth(str, 1));
    c.height = 7;
    c.style.width = c.width * scale + 'px';
    c.style.height = c.height * scale + 'px';
    text(str, 0, 0, color, 1, 'left', false, c.getContext('2d'));
    return c;
  }

  // Set by the touch layer: swaps keyboard instructions for tap ones, shows tap targets.
  const hints = { touch: false };

  // Cell text rule (both sizes): up to 3 characters use the normal font; longer
  // strings (expressions, up to board.maxChars = 6) use the condensed font.
  // Big: scale 2, 3 chars = 35px, 6 condensed = 46px, inside a 48px cell.
  // Small (cell shared with a sprite): scale 1, top-left, on a dark plate.
  const condensedFor = str => String(str).length > 3;
  function cellText(str, x, y, color, scale, align) {
    text(str, x, y, color, scale, align, condensedFor(str));
  }

  // ---- Original creature sprite ("the chomper"), 14x12 ----
  // o outline · b body · w eye white · k pupil/mouth · t tooth
  // ---- sprites: from the theme (theme.sprites) ----
  const SPR_IDLE = TH.sprites.idle, SPR_CHOMP = TH.sprites.chomp, SPR_DEAD = TH.sprites.dead;
  const mirror = half => half.map(h => h + [...h].reverse().join(''));
  const GRUMP_BODY = mirror(TH.sprites.grumpHalf);
  const GRUMP = TH.sprites.grumpFeet.map(feet => [...GRUMP_BODY, feet]); // two walk frames (2nd drawn 1px higher)
  const SAFE_ICON = TH.sprites.safeIcon;

  const creatureMap = hurt => ({ o: P.outline, b: hurt ? P.bodyHurt : P.body, w: P.eye, k: P.mouth, t: P.tooth, p: P.cheek });
  const grumpMap = color => ({ o: P.outline, c: color, w: P.eye, k: P.mouth, t: P.tooth });

  // rows: array of strings; map: char -> colour (unmapped chars are transparent)
  function sprite(rows, x, y, scale, map) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        const col = map[row[c]];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
      }
    }
  }

  function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
  function frame(x, y, w, h, color) {
    rect(x, y, w, 1, color); rect(x, y + h - 1, w, 1, color);
    rect(x, y, 1, h, color); rect(x + w - 1, y, 1, h, color);
  }
  function dim(alpha = 0.7) { ctx.fillStyle = `rgba(8,6,20,${alpha})`; ctx.fillRect(0, 0, W, H); }
  function banner(lines, color = P.accent, centreY = H / 2) {
    // lines: [{ s, scale, color }]
    const pad = 8;
    let h = pad, w = 0;
    for (const l of lines) { h += 7 * (l.scale || 1) + 5; w = Math.max(w, textWidth(l.s.toUpperCase(), l.scale || 1)); }
    h += pad - 5; w += pad * 2;
    const x = Math.floor((W - w) / 2), y = Math.floor(centreY - h / 2);
    rect(x, y, w, h, P.panel); frame(x, y, w, h, color);
    let yy = y + pad;
    for (const l of lines) { text(l.s, W / 2, yy, l.color || color, l.scale || 1, 'center'); yy += 7 * (l.scale || 1) + 5; }
  }

  // ---- screens ----
  const fmtTime = ms => { const sec = Math.floor(ms / 1000); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; };

  // Top-N table centred on cx. highlight = row index to flash (or -1).
  function drawTable(list, cx, y, rowH, highlight, t) {
    for (let i = 0; i < PR.hiscores.perTrack; i++) {
      const e = list[i], yy = y + i * rowH;
      const line = e ? `${i + 1} ${e.name} ${String(e.score).padStart(5, ' ')} S${e.stage}`
                     : `${i + 1} --- ${'-----'} ${'   '}`;
      const hot = i === highlight;
      if (hot) rect(cx - 52, yy - 2, 104, rowH, P.panel);
      const col = hot ? (Math.floor(t / 250) % 2 ? P.accent : P.number) : e ? P.number : P.dim;
      text(line, cx - 45, yy, col);
    }
  }

  function drawTitle(s, t) {
    rect(0, 0, W, H, P.bg);
    const TL = TH.titleLayout;
    text(TH.title, W / 2, TL.titleY, P.accent, TL.titleScale, 'center');
    text(TL.tagline, W / 2, TL.taglineY, P.dim, 1, 'center');

    // parade: the Chomper chomps across the screen with two Grumps in pursuit
    const span = W + 56, ground = TL.ground; // each sprite is off-screen for only ~7% of its loop
    const at = offset => Math.round(((t * 0.045 + offset) % span + span) % span) - 28;
    rect(0, ground + 1, W, 1, P.panel);
    const chomp = Math.floor(t / 180) % 2 === 0, cs = chomp ? SPR_CHOMP : SPR_IDLE;
    sprite(cs, at(0), ground - cs.length * 2 + 1 - (chomp ? 0 : 1), 2, creatureMap(false));
    [['wanderer', -46], ['stalker', -84]].forEach(([type, off], i) => {
      const f = Math.floor(t / 220 + i) % 2;
      sprite(GRUMP[f], at(off), ground - GRUMP[f].length * 2 + 1 - f, 2, grumpMap(TH.grumpColors[type]));
    });

    // menu (left) + high scores for the selected track (right)
    PR.menu.forEach((id, i) => {
      const y = TL.menuY + i * TL.menuStep, sel = i === s.menuIndex;
      if (sel) { rect(4, y - 3, 182, 13, P.panel); text('>', 8, y, P.accent); }
      text(Engine.trackLabel(id), 16, y, sel ? P.accent : P.dim);
    });
    rect(190, 88, 1, 58, P.panel);
    text('High scores', 254, 90, P.dim, 1, 'center');
    drawTable(s.hiscores[PR.menu[s.menuIndex]] || [], 254, 102, 10, -1, t);

    if (hints.touch) {
      if (Math.floor(t / 500) % 2 === 0) text('Tap a mode, then tap it again', W / 2, 158, P.accent, 1, 'center');
      text('Tap a cell to walk there', W / 2, 172, P.dim, 1, 'center');
      text('Tap yourself or EAT to eat', W / 2, 184, P.dim, 1, 'center');
    } else {
      if (Math.floor(t / 500) % 2 === 0) text('Press Space', W / 2, 158, P.accent, 1, 'center');
      text('Arrows/WASD move  Space eat  Esc pause', W / 2, 172, P.dim, 1, 'center');
      text(`Up/Down choose   M sound ${s.muted ? 'off' : 'on'}`, W / 2, 184, P.dim, 1, 'center');
    }
  }

  // v: the game state, or the attract demo's view of a board (demo: true, no player)
  function drawBoard(v, t) {
    rect(0, 0, W, H, P.bg);
    const m = MODES[v.modeId];

    // header
    rect(0, 0, W, HEADER_H, P.panel);
    text(m.title(v.params), MARGIN, 6, P.accent);
    text(v.demo ? 'Demo' : 'Stage ' + v.level, W - MARGIN, 6, P.number, 1, 'right');

    // grid
    const bad = v.flash && (v.flash.kind === 'bad' || v.flash.kind === 'dead');
    const occupied = new Set(v.enemies.map(e => e.row * PR.grid.cols + e.col));
    if (v.player) occupied.add(v.player.row * PR.grid.cols + v.player.col);
    const safeVisible = v.safe && (v.safe.t > PR.safeCell.blinkBefore || Math.floor(v.safe.t / 150) % 2 === 0);
    const smallLabels = []; // drawn after the sprites so long expressions stay readable
    for (let r = 0; r < PR.grid.rows; r++) {
      for (let c = 0; c < PR.grid.cols; c++) {
        const i = r * PR.grid.cols + c, cell = v.cells[i];
        const x = gridX + c * cellW, y = gridY + r * cellH;
        const flashing = v.flash && v.flash.cell === i;
        const safeHere = safeVisible && v.safe.col === c && v.safe.row === r;
        let fill = cell.eaten ? P.cellEaten : P.cell;
        if (safeHere) fill = P.safeFill;
        if (flashing && bad && Math.floor(v.flash.t / 120) % 2 === 0) fill = P.bad;
        if (flashing && v.flash.kind === 'good') fill = P.good;
        rect(x + 1, y + 1, cellW - 2, cellH - 2, fill);
        frame(x, y, cellW, cellH, P.cellEdge);
        if (safeHere) {
          frame(x + 2, y + 2, cellW - 4, cellH - 4, P.safeEdge);
          sprite(SAFE_ICON, x + cellW - 10, y + 3, 1, { o: P.safeEdge }); // rows y+3..7, clear of cell text at y+8
        }
        if (cell.fxT > 0) frame(x + 1, y + 1, cellW - 2, cellH - 2, P.rewrite);
        if (!cell.eaten) {
          if (occupied.has(i)) smallLabels.push({ str: cell.value, x: x + 4, y: y + 4 });
          else cellText(cell.value, x + cellW / 2, y + Math.floor((cellH - 14) / 2), P.number, 2, 'center');
        }
      }
    }
    frame(gridX - 1, gridY - 1, cellW * PR.grid.cols + 2, cellH * PR.grid.rows + 2, bad ? P.bad : P.cellEdge);

    // enemies (a Grump sharing the player's cell shifts left so both show)
    const sw = 14 * 2;
    for (const e of v.enemies) {
      const ex = gridX + e.col * cellW, ey = gridY + e.row * cellH;
      const f = Math.floor(e.animT / 250) % 2, spr = GRUMP[f];
      const withPlayer = v.player && e.col === v.player.col && e.row === v.player.row;
      const x = withPlayer ? ex + 3 : ex + cellW - sw - 3;
      sprite(spr, x, ey + cellH - spr.length * 2 - 1 - f, 2, grumpMap(TH.grumpColors[e.type]));
    }

    // player
    const dying = v.flash && v.flash.kind === 'dead';
    if (v.player) {
      const px = gridX + v.player.col * cellW, py = gridY + v.player.row * cellH;
      if (dying) {
        // shake with X-eyes, then blink out while floating up
        const k = 1 - v.flash.t / v.flash.dur;
        const shake = k < 0.6 ? (Math.floor(v.flash.t / 60) % 2 ? 1 : -1) : 0;
        const lift = k < 0.6 ? 0 : Math.round((k - 0.6) * 20);
        const show = k < 0.6 || Math.floor(v.flash.t / 80) % 2 === 0;
        if (show) sprite(SPR_DEAD, px + cellW - sw - 3 + shake, py + cellH - SPR_DEAD.length * 2 - 1 - lift, 2, creatureMap(true));
      } else {
        const spr = v.player.chompT > 0 ? SPR_CHOMP : SPR_IDLE;
        sprite(spr, px + cellW - sw - 3, py + cellH - spr.length * 2 - 1, 2, creatureMap(bad));
      }
    }

    // numbers under the player / Grumps
    for (const l of smallLabels) {
      rect(l.x - 1, l.y - 1, textWidth(l.str, 1, condensedFor(l.str)) + 2, 9, P.panel);
      cellText(l.str, l.x, l.y, P.number, 1, 'left');
    }

    // "+points" pop
    if (v.flash && v.flash.kind === 'good') {
      const k = 1 - v.flash.t / v.flash.dur;
      const fc = v.flash.cell % PR.grid.cols, fr = Math.floor(v.flash.cell / PR.grid.cols);
      text(v.flash.msg, gridX + fc * cellW + cellW / 2, gridY + fr * cellH - Math.round(k * 10), P.good, 1, 'center');
    }

    // HUD
    const hudY = H - HUD_H;
    rect(0, hudY, W, HUD_H, P.panel);
    if (v.demo) {
      if (Math.floor(t / 500) % 2 === 0) text(hints.touch ? 'Tap to return' : 'Press any key', W / 2, hudY + 8, P.accent, 1, 'center');
    } else {
      text('Score ' + String(v.score).padStart(5, '0'), MARGIN, hudY + 8, P.number);
      if (v.muted) text('Muted', W / 2, hudY + 8, P.dim, 1, 'center');
      for (let i = 0; i < PR.startLives; i++) {
        const x = W - MARGIN - 14 - i * 17;
        if (i < v.lives) sprite(SPR_IDLE, x, hudY + 5, 1, creatureMap(false));
        else frame(x + 3, hudY + 8, 8, 6, P.cellEdge);
      }
    }

    // wrong-eat / death message
    if (dying) {
      // keep the death animation visible: banner goes in the half of the grid the player isn't in
      const top = v.player.row >= Math.floor(PR.grid.rows / 2);
      const msg = TH.deathText ? TH.deathText(v.flash.msg) : v.flash.msg;
      banner([{ s: msg, color: P.bad }], P.bad, gridY + cellH * (top ? 1 : PR.grid.rows - 1));
    } else if (bad) {
      const msg = TH.wrongText ? TH.wrongText(v.flash.msg) : v.flash.msg;
      banner([{ s: msg, color: P.bad }], P.bad);
    }

    // death screen flash (profile.feel)
    const F = PR.feel;
    if (dying && F.deathFlash) {
      const age = v.flash.dur - v.flash.t;
      if (age < F.deathFlashMs) {
        ctx.globalAlpha = F.deathFlashAlpha * (1 - age / F.deathFlashMs);
        rect(0, 0, W, H, F.deathFlashColor);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawNameEntry(s, t) {
    rect(0, 0, W, H, P.bg);
    text('New high score!', W / 2, 16, P.accent, 2, 'center');
    text('Score ' + s.score, W / 2, 42, P.number, 1, 'center');
    text(`${Engine.trackLabel(s.track)}  ·  Stage ${s.level}`, W / 2, 54, P.dim, 1, 'center');
    const e = s.entry, pitch = 30, x0 = W / 2 - pitch;
    if (e.preset !== undefined) {               // profile.hiscores.presets: pick a name, no typing
      frame(W / 2 - 40, 82, 80, 36, P.accent);
      text(e.initials.join(''), W / 2, 86, P.accent, 4, 'center');
      for (let k = 0; k < 6; k++) {
        rect(W / 2 - k, 66 + k, 2 * k + 1, 1, P.accent);
        rect(W / 2 - k, 133 - k, 2 * k + 1, 1, P.accent);
      }
      if (hints.touch) {
        text('Tap the arrows to pick a name', W / 2, 146, P.dim, 1, 'center');
        rect(W / 2 - 36, 158, 72, 20, P.panel);
        frame(W / 2 - 36, 158, 72, 20, P.accent);
        text('Save', W / 2, 165, P.accent, 1, 'center');
      } else {
        text('Up/Down pick a name', W / 2, 152, P.dim, 1, 'center');
        text('Space save', W / 2, 166, P.number, 1, 'center');
      }
      return;
    }
    e.initials.forEach((ch, i) => {
      const cx = x0 + i * pitch, sel = i === e.pos;
      frame(cx - 13, 82, 26, 36, sel ? P.accent : P.cellEdge);
      text(ch, cx, 86, sel ? P.accent : P.number, 4, 'center');
      if (hints.touch) {                        // tap targets: an arrow above and below every letter
        for (let k = 0; k < 6; k++) {
          rect(cx - k, 66 + k, 2 * k + 1, 1, sel ? P.accent : P.dim);
          rect(cx - k, 133 - k, 2 * k + 1, 1, sel ? P.accent : P.dim);
        }
      } else if (sel && Math.floor(t / 300) % 2 === 0) {
        for (let k = 0; k < 4; k++) {           // little arrows above and below
          rect(cx - k, 76 - 3 + k, 2 * k + 1, 1, P.accent);
          rect(cx - k, 124 + 3 - k, 2 * k + 1, 1, P.accent);
        }
      }
    });
    if (hints.touch) {
      text('Tap the arrows to change letters', W / 2, 146, P.dim, 1, 'center');
      rect(W / 2 - 36, 158, 72, 20, P.panel);
      frame(W / 2 - 36, 158, 72, 20, P.accent);
      text('Save', W / 2, 165, P.accent, 1, 'center');
    } else {
      text('Up/Down letter   Left/Right move', W / 2, 152, P.dim, 1, 'center');
      text('Space save', W / 2, 166, P.number, 1, 'center');
    }
  }

  function drawGameOver(s, t) {
    rect(0, 0, W, H, P.bg);
    text('Game over', W / 2, 8, P.bad, 3, 'center');
    text('Score ' + s.score, W / 2, 36, P.number, 2, 'center');
    text(Engine.trackLabel(s.track), W / 2, 56, P.dim, 1, 'center');
    text(`Stage ${s.level}: ${Engine.mode().title(s.params)}`, W / 2, 66, P.number, 1, 'center');
    text('High scores', W / 2, 84, P.dim, 1, 'center');
    const hl = s.newEntry && s.newEntry.track === s.track ? s.newEntry.rank : -1;
    drawTable(s.hiscores[s.track] || [], W / 2, 96, 11, hl, t);
    if (s.screenT <= 0 && Math.floor(t / 500) % 2 === 0) text(hints.touch ? 'Tap to continue' : 'Press Space', W / 2, 172, P.accent, 1, 'center');
  }

  function draw(s, t) {
    switch (s.screen) {
      case 'title': drawTitle(s, t); break;
      case 'attract': {
        const a = s.attract;
        drawBoard({ demo: true, modeId: a.modeId, params: a.params, level: a.level, cells: a.cells,
                    enemies: a.enemies, player: null, safe: null, flash: null }, t);
        break;
      }
      case 'playing': drawBoard(s, t); break;
      case 'paused':
        drawBoard(s, t); dim();
        text('Paused', W / 2, 74, P.accent, 3, 'center');
        text(hints.touch ? 'Tap to resume' : 'Esc or Space to resume', W / 2, 108, P.number, 1, 'center');
        break;
      case 'levelclear': {
        const st = s.levelStats;
        drawBoard(s, t);
        banner([{ s: 'Stage clear!', scale: 2 }, { s: 'Bonus +' + s.lastBonus, color: P.number },
                { s: `${st.correct} correct  ${st.wrong} wrong  ${fmtTime(st.ms)}`, color: P.dim }]);
        break;
      }
      case 'entername': drawNameEntry(s, t); break;
      case 'gameover': drawGameOver(s, t); break;
    }
  }

  // CSS position and size of the canvas, chosen by layout() in INPUT.
  function place(left, top, w, h) {
    Object.assign(canvas.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });
  }

  // Touch hit-testing: a point in canvas pixels (0..320, 0..200) -> what is
  // there on the current screen. Uses the same geometry the screens are drawn with.
  //   playing   { kind: 'cell', col, row }: nearest cell, also for taps up to half a
  //             cell outside the grid (its frame, the header, the HUD, or just beside
  //             the canvas: x and y may be outside 0..320 / 0..200)
  //   title     { kind: 'menu', index }
  //   entername { kind: 'letter', index, dir: 'up' | 'down' | null } or { kind: 'save' }
  //   other screens: { kind: 'screen' } (a tap anywhere)
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function hitTest(s, x, y) {
    const { cols, rows } = PR.grid;
    switch (s.screen) {
      case 'playing': {
        const gw = cellW * cols, gh = cellH * rows;
        if (x < gridX - cellW / 2 || x > gridX + gw + cellW / 2 || y < gridY - cellH / 2 || y > gridY + gh + cellH / 2) return null;
        return { kind: 'cell', col: clamp(Math.floor((x - gridX) / cellW), 0, cols - 1),
                 row: clamp(Math.floor((y - gridY) / cellH), 0, rows - 1) };
      }
      case 'title': {
        const TL = TH.titleLayout;
        for (let i = 0; i < PR.menu.length; i++) {
          const y0 = TL.menuY + i * TL.menuStep - 3;
          if (x < 190 && y >= y0 && y < y0 + TL.menuStep) return { kind: 'menu', index: i };
        }
        return null;
      }
      case 'entername': {
        const pitch = 30, x0 = W / 2 - pitch;
        if (s.entry.preset !== undefined) {     // one name box with an arrow above and below
          if (Math.abs(x - W / 2) <= 44) {
            if (y >= 56 && y < 82) return { kind: 'letter', index: 0, dir: 'up' };
            if (y >= 82 && y < 118) return { kind: 'letter', index: 0, dir: null };
            if (y >= 118 && y < 144) return { kind: 'letter', index: 0, dir: 'down' };
          }
          if (y >= 154 && y < 182 && Math.abs(x - W / 2) <= 44) return { kind: 'save' };
          return null;
        }
        for (let i = 0; i < s.entry.initials.length; i++) {
          if (Math.abs(x - (x0 + i * pitch)) > pitch / 2) continue;
          if (y >= 56 && y < 82) return { kind: 'letter', index: i, dir: 'up' };
          if (y >= 82 && y < 118) return { kind: 'letter', index: i, dir: null };
          if (y >= 118 && y < 144) return { kind: 'letter', index: i, dir: 'down' };
        }
        if (y >= 154 && y < 182 && Math.abs(x - W / 2) <= 44) return { kind: 'save' };
        return null;
      }
      default:
        return { kind: 'screen' };
    }
  }

  return { draw, place, canvas, label, hitTest, hints,
           geom: { W, H, gridX, gridY, cellW, cellH } };
})();


/* =====================================================================
 * 4. SOUND
 *    Tiny WebAudio synth: every effect is built from oscillators and a
 *    noise buffer at play time. No sample files. Browsers only allow audio
 *    after a user gesture, so INPUT calls Sound.unlock() on key/pointer down.
 *    Volume and default mute live in CONFIG.sound; M toggles mute (saved).
 *    The theme's sound.pitch multiplies every frequency and sound.tempo speeds
 *    everything up (durations and delays are divided by it).
 * ===================================================================== */

const Sound = (() => {
  const { pitch, tempo } = CONFIG.theme.sound;
  let ac = null, master = null, noiseBuf = null;
  let muted = !!CONFIG.sound.mutedByDefault;
  const stats = { unlocked: false, played: 0 };

  function unlock() {
    try {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        master = ac.createGain();
        master.gain.value = CONFIG.sound.volume;
        master.connect(ac.destination);
      }
      if (ac.state === 'suspended') ac.resume();
      stats.unlocked = true;
    } catch (e) { /* no audio available: stay silent */ }
  }

  // One oscillator note: wave type, start/end frequency (Hz), length (s), peak volume, delay (s).
  function tone(type, f0, f1, dur, vol, at = 0) {
    f0 *= pitch; f1 *= pitch; dur /= tempo; at /= tempo;
    const t0 = ac.currentTime + at;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }

  // A burst of band-passed noise (crunches, thuds).
  function noise(dur, vol, freq, at = 0) {
    freq *= pitch; dur /= tempo; at /= tempo;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.5), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = ac.currentTime + at;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.4;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.03);
  }

  // The effects (all original). Names match the engine's event names.
  const SFX = {
    move()    { tone('square', 520, 600, 0.035, 0.08); },
    correct() { noise(0.07, 0.5, 1900); noise(0.06, 0.35, 900, 0.045); tone('square', 330, 520, 0.08, 0.12); },
    wrong()   { tone('sawtooth', 150, 110, 0.28, 0.22); tone('sawtooth', 157, 116, 0.28, 0.16); },
    death()   { tone('triangle', 620, 70, 0.65, 0.3); tone('square', 310, 40, 0.65, 0.08); noise(0.35, 0.3, 300, 0.3); },
    clear()   { [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.1, 0.13, i * 0.085)); },
    spawn()   { tone('triangle', 95, 150, 0.12, 0.25); tone('triangle', 150, 80, 0.16, 0.25, 0.12); },
    safe()    { tone('sine', 880, 1320, 0.14, 0.18); tone('sine', 1320, 1760, 0.16, 0.14, 0.11); },
    menu()    { tone('triangle', 1200, 1200, 0.03, 0.08); },
  };

  // Returns true if the effect actually started.
  function play(name) {
    const fx = SFX[name];
    if (!fx || muted || !ac || ac.state !== 'running') return false;
    try { fx(); stats.played++; return true; } catch (e) { return false; }
  }

  return { unlock, play, setMuted: m => { muted = !!m; }, isMuted: () => muted, names: Object.keys(SFX), stats };
})();


/* =====================================================================
 * 5. STORAGE
 *    One versioned localStorage entry per game (profile.storageKey, shape
 *    version CONFIG.storage.version) holding Engine.saveData() (high scores,
 *    mute, last initials) plus the touch mode.
 *    Unreadable, foreign-version or missing data loads as "nothing saved".
 * ===================================================================== */

const Storage = (() => {
  const key = CONFIG.profile.storageKey, version = CONFIG.storage.version;
  function load() {
    try {
      const raw = window.localStorage.getItem(key);
      if (!raw) return null;
      const d = JSON.parse(raw);
      return d && d.version === version ? d : null;
    } catch (e) { return null; }
  }
  function save(data) {
    try { window.localStorage.setItem(key, JSON.stringify({ version, ...data })); return true; }
    catch (e) { return false; }
  }
  return { load, save, key };
})();


/* =====================================================================
 * 6. INPUT
 *    Physical input -> abstract actions -> Engine.handle(action).
 *    Keyboard: KEYMAP. Unmapped keys send 'any' (wakes the title / ends the demo).
 *    Touch: taps on the canvas, on-screen buttons and the layout that places them.
 *      Everything still goes through emit(action); the touch layer only *reads*
 *      Engine.state (screen, player, lockT, menu/entry cursor) to decide what to send.
 *    Key, pointer and touch handlers also unlock audio (browsers require a gesture).
 * ===================================================================== */

const Input = (() => {
  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    Space: 'eat',
    Enter: 'confirm', NumpadEnter: 'confirm',
    Escape: 'pause', KeyP: 'pause',
    KeyM: 'mute',
  };
  const REPEATABLE = new Set(['up', 'down', 'left', 'right']);
  const T = CONFIG.touch, P = CONFIG.theme.palette, VW = CONFIG.view.width, VH = CONFIG.view.height;
  const canvas = Render.canvas, footer = document.getElementById('footer');

  function emit(action) { Engine.handle(action); }

  // ---------- keyboard ----------
  window.addEventListener('keydown', e => {
    Sound.unlock();
    const action = KEYMAP[e.code];
    if (!action) { if (!e.repeat) emit('any'); return; }
    e.preventDefault();
    if (e.repeat && !REPEATABLE.has(action)) return;
    if (REPEATABLE.has(action) || action === 'eat') walk = null; // keys take over from a tap-walk
    emit(action);
  });
  window.addEventListener('blur', () => emit('blur'));

  // ---------- touch state ----------
  // Touch UI shows on coarse-pointer devices, or from the first touch on any device.
  let touchOn = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  let mode = T.defaultMode;     // 'tap' | 'pad' (saved with the other settings)
  let walk = null;              // { col, row, t }: tap-to-move target, one step per T.stepMs
  let onSettings = () => {};
  Render.hints.touch = touchOn;

  function activateTouch() {
    if (touchOn) return;
    touchOn = true;
    Render.hints.touch = true;
    layout();
  }

  // ---------- taps on the canvas ----------
  function tap(x, y) {
    const s = Engine.state;
    if (s.screen === 'attract') { emit('any'); return; }
    if (s.screen === 'title') emit('any');             // keeps the idle timer awake
    const hit = Render.hitTest(s, x, y);
    if (!hit) return;
    switch (s.screen) {
      case 'playing': {
        if (s.lockT > 0) return;                       // ignored during wrong-eat / death lockouts
        if (hit.col === s.player.col && hit.row === s.player.row) { walk = null; emit('eat'); return; }
        walk = { col: hit.col, row: hit.row, t: 0, fresh: true };
        stepWalk();                                    // first step right away, then every T.stepMs
        return;
      }
      case 'title': {
        if (hit.index === s.menuIndex) { emit('confirm'); return; }
        const n = CONFIG.profile.menu.length, d = (hit.index - s.menuIndex + n) % n;
        const dir = d <= n / 2 ? 'down' : 'up';
        for (let k = Math.min(d, n - d); k > 0; k--) emit(dir);
        return;
      }
      case 'entername': {
        if (hit.kind === 'save') { emit('confirm'); return; }
        for (let k = 0; k < 3 && s.entry && s.entry.pos < hit.index; k++) emit('right');
        for (let k = 0; k < 3 && s.entry && s.entry.pos > hit.index; k++) emit('left');
        if (hit.dir && s.entry && s.entry.pos === hit.index) emit(hit.dir);
        return;
      }
      case 'gameover': emit('confirm'); return;
      case 'paused': emit('pause'); return;
      default: return;                                 // levelclear: nothing to do
    }
  }

  // Walk toward the target along a shortest Manhattan path (the longer axis first).
  // Stops on arrival, on a new tap, on keys/pad/EAT, or when play is locked or left.
  function stepWalk() {
    const s = Engine.state;
    if (!walk || s.screen !== 'playing' || s.lockT > 0) { walk = null; return; }
    const p = s.player, dx = walk.col - p.col, dy = walk.row - p.row;
    if (!dx && !dy) { walk = null; return; }
    emit(Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    if (!walk) return;
    walk.t = T.stepMs;
    if (p.col === walk.col && p.row === walk.row) walk = null;
  }

  canvas.addEventListener('pointerdown', e => {
    Sound.unlock();
    canvas.focus();
    if (e.pointerType === 'mouse') emit('any');             // desktop mouse: unchanged
  });
  // Touch / pen taps, listened for on the whole page: the grid sits close to the
  // canvas edge, so a forgiving tap just beside the canvas must count too.
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    if (e.target.closest && e.target.closest('.tbtn, #rotate')) return; // buttons handle themselves
    Sound.unlock();
    activateTouch();
    if (!e.isPrimary) return;                                // second finger (pinch): ignore
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * VW / r.width, y = (e.clientY - r.top) * VH / r.height;
    const screen = Engine.state.screen;
    if (e.target !== canvas && screen !== 'playing' && screen !== 'attract') return;
    if (e.cancelable) e.preventDefault();
    tap(x, y);
  });

  // No scrolling, pinch-zoom or double-tap zoom anywhere on the page.
  const block = e => { if (e.cancelable) e.preventDefault(); };
  for (const type of ['touchstart', 'touchmove', 'touchend']) canvas.addEventListener(type, block, { passive: false });
  document.addEventListener('touchmove', block, { passive: false });
  for (const type of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(type, block);
  window.addEventListener('touchstart', activateTouch, { passive: true });
  // iOS only starts audio from touchend / pointerup, not touchstart
  window.addEventListener('touchend', () => Sound.unlock(), { passive: true });
  window.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') Sound.unlock(); });

  // ---------- on-screen buttons ----------
  const css = document.createElement('style');
  css.textContent = `.tbtn{background:${P.panel};border-color:${P.cellEdge}}
    .tbtn.down{background:${P.cell};border-color:${P.accent}}
    #rotate{background:${P.panel};border-color:${P.accent}}`;
  document.head.appendChild(css);

  const buttons = {};
  let repeatTimer = null;
  const stopRepeat = () => { clearTimeout(repeatTimer); repeatTimer = null; };
  function startRepeat(action) {
    stopRepeat();
    repeatTimer = setTimeout(function again() { emit(action); repeatTimer = setTimeout(again, T.stepMs); }, T.padRepeatDelay);
  }
  function setLabel(b, str, scale) {
    if (b.dataset.label === str) return;
    b.dataset.label = str;
    b.replaceChildren(Render.label(str, P.number, scale));
  }
  function makeButton(id, str, scale, press, repeat) {
    const b = document.createElement('button');
    b.id = 'btn-' + id; b.type = 'button'; b.tabIndex = -1; b.className = 'tbtn';
    b.setAttribute('aria-label', id);
    b.dataset.scale = scale;
    setLabel(b, str, scale);
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      Sound.unlock();
      if (e.pointerType !== 'mouse') activateTouch();
      try { b.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointers */ }
      b.classList.add('down');
      walk = null;
      press();
      if (repeat) startRepeat(repeat);
    });
    const release = () => { b.classList.remove('down'); stopRepeat(); };
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(type, release);
    b.addEventListener('touchstart', block, { passive: false });
    document.body.appendChild(b);
    buttons[id] = b;
  }
  makeButton('eat', 'Eat', 3, () => emit('eat'));
  makeButton('pause', 'II', 3, () => emit('pause'));
  for (const [dir, arrow] of [['up', '↑'], ['down', '↓'], ['left', '←'], ['right', '→']]) makeButton(dir, arrow, 4, () => emit(dir), dir);
  makeButton('touchMode', 'Touch: tap', 2, () => {
    mode = mode === 'tap' ? 'pad' : 'tap';
    layout();
    Sound.play('menu');
    onSettings();
  });
  makeButton('sound', 'Sound: on', 2, () => emit('mute'));

  // Which buttons each screen shows (only once the touch UI is on).
  let shownKey = '';
  function syncButtons() {
    const s = Engine.state, want = new Set();
    if (touchOn) {
      if (s.screen === 'playing') {
        want.add('eat'); want.add('pause');
        if (mode === 'pad') ['up', 'down', 'left', 'right'].forEach(d => want.add(d));
      } else if (s.screen === 'paused') want.add('pause');
      else if (s.screen === 'title') { want.add('touchMode'); want.add('sound'); }
    }
    const key = [...want].join() + '|' + mode + '|' + s.muted;
    if (key === shownKey) return;
    shownKey = key;
    setLabel(buttons.touchMode, `Touch: ${mode}`, 2);
    setLabel(buttons.sound, `Sound: ${s.muted ? 'off' : 'on'}`, 2);
    for (const [id, b] of Object.entries(buttons)) b.classList.toggle('show', want.has(id) && b.dataset.placed === '1');
  }

  // ---------- portrait hint ----------
  const hint = document.createElement('div');
  hint.id = 'rotate';
  hint.addEventListener('pointerdown', e => { e.preventDefault(); dismissHint(); });
  hint.addEventListener('touchstart', block, { passive: false });
  document.body.appendChild(hint);
  let hintDone = false, hintTimer = null;
  function dismissHint() { hintDone = true; clearTimeout(hintTimer); hint.style.display = 'none'; }

  // ---------- layout ----------
  // The canvas gets the largest whole-number scale that leaves room for the
  // buttons. Buttons always sit outside the canvas (so never over the grid):
  //   'plain'   no touch UI: canvas centred above the footer (desktop look)
  //   'side'    landscape: EAT in one side column, pause + D-pad in the other
  //   'bottom'  portrait (or when it gives a bigger scale): a row under the canvas
  // Safe-area insets (notches, iOS home bar) are kept clear.
  function insets() {
    const cs = getComputedStyle(document.documentElement), v = n => parseFloat(cs.getPropertyValue(n)) || 0;
    return { t: v('--sat'), r: v('--sar'), b: v('--sab'), l: v('--sal') };
  }
  const fitScale = (w, h) => { const s = Math.min(w / VW, h / VH); return s >= 1 ? Math.floor(s) : Math.max(0.25, s); };
  let current = null; // last layout, for tests / debugging

  function layout() {
    const g = T.gap, ins = insets(), vw = window.innerWidth, vh = window.innerHeight;
    const area = { x: ins.l, y: ins.t, w: vw - ins.l - ins.r, h: vh - ins.t - ins.b };
    const footH = footer.offsetHeight;
    const eat = Math.max(56, T.eatSize), pad = Math.max(56, T.padSize), small = T.smallSize;
    const padBlock = mode === 'pad' ? 3 * pad + 2 * 4 : 0;
    const colW = Math.max(eat, T.toggleW, small, padBlock) + 2 * g;     // each side column
    const rowH = Math.max(eat, padBlock, small, T.toggleH) + 2 * g;     // the row under the canvas
    const portrait = vh > vw;
    let kind = 'plain', s;
    if (!touchOn) s = fitScale(area.w - 8, area.h - footH - 8);
    else {
      const sSide = fitScale(area.w - 2 * colW, area.h - footH);
      const sBottom = fitScale(area.w - 2 * g, area.h - footH - rowH);
      if (portrait || sBottom > sSide) { kind = 'bottom'; s = sBottom; } else { kind = 'side'; s = sSide; }
    }
    const cw = Math.round(VW * s), ch = Math.round(VH * s), below = kind === 'bottom' ? rowH : 0;
    const top = area.y + Math.max(0, Math.floor((area.h - ch - below - footH) / 2));
    const left = area.x + Math.floor((area.w - cw) / 2);
    Render.place(left, top, cw, ch);
    footer.style.top = top + ch + below + 'px';

    const pos = {}, eatRight = T.eatSide !== 'left';
    const padAt = (x, y) => {
      if (!padBlock) return;
      const st = pad + 4;
      pos.up = [x + st, y, pad, pad]; pos.left = [x, y + st, pad, pad];
      pos.right = [x + 2 * st, y + st, pad, pad]; pos.down = [x + st, y + 2 * st, pad, pad];
    };
    if (kind === 'side') {
      const colR = { x: left + cw, w: area.x + area.w - (left + cw) }, colL = { x: area.x, w: left - area.x };
      const eatCol = eatRight ? colR : colL, other = eatRight ? colL : colR, mid = c => c.x + c.w / 2;
      const bottom = area.y + area.h - g;
      pos.eat = [mid(eatCol) - eat / 2, bottom - eat, eat, eat];
      pos.touchMode = [mid(eatCol) - T.toggleW / 2, area.y + g, T.toggleW, T.toggleH];
      pos.sound = [mid(eatCol) - T.toggleW / 2, area.y + 2 * g + T.toggleH, T.toggleW, T.toggleH];
      pos.pause = [mid(other) - small / 2, area.y + g, small, small];
      padAt(mid(other) - padBlock / 2, bottom - padBlock);
    } else if (kind === 'bottom') {
      const rowY = top + ch + g, inner = rowH - 2 * g, xL = area.x + g, xR = area.x + area.w - g;
      const midY = h => rowY + (inner - h) / 2;
      pos.eat = [eatRight ? xR - eat : xL, midY(eat), eat, eat];
      if (padBlock) {
        padAt(eatRight ? xL : xR - padBlock, midY(padBlock));
        pos.pause = [area.x + area.w / 2 - small / 2, midY(small), small, small];
      } else {
        pos.pause = [eatRight ? xL : xR - small, midY(small), small, small];
      }
      const both = 2 * T.toggleW + g, tx = area.x + (area.w - both) / 2;
      pos.touchMode = [tx, midY(T.toggleH), T.toggleW, T.toggleH];
      pos.sound = [tx + T.toggleW + g, midY(T.toggleH), T.toggleW, T.toggleH];
    }
    for (const [id, b] of Object.entries(buttons)) {
      const p = pos[id];
      b.dataset.placed = p ? '1' : '0';
      if (p) Object.assign(b.style, { left: Math.round(p[0]) + 'px', top: Math.round(p[1]) + 'px', width: p[2] + 'px', height: p[3] + 'px' });
    }
    shownKey = '';
    syncButtons();

    // portrait: one-line hint until dismissed or T.rotateHintMs has passed
    const showHint = touchOn && portrait && !hintDone;
    hint.style.display = showHint ? 'block' : 'none';
    if (showHint) {
      hint.replaceChildren(Render.label('Rotate for best play  ×', P.number, vw >= 340 ? 2 : 1));
      Object.assign(hint.style, { top: area.y + g + 'px', left: '50%', transform: 'translateX(-50%)' });
      if (!hintTimer) hintTimer = setTimeout(dismissHint, T.rotateHintMs);
    }
    current = { kind, scale: s, canvas: { x: left, y: top, w: cw, h: ch }, portrait };
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

  // Called every animation frame by the boot loop.
  function update(dt) {
    if (walk) {
      if (walk.fresh) walk.fresh = false;   // this frame's dt began before the tap: don't count it
      else walk.t -= dt;
      if (walk.t <= 0) stepWalk();
    }
    syncButtons();
  }

  return {
    emit, layout, update,
    touchActive: () => touchOn,
    touchMode: () => mode,
    setTouchMode(m) { if (m === 'tap' || m === 'pad') { mode = m; layout(); } },
    onSettingsChanged(fn) { onSettings = fn; },
    layoutInfo: () => current,
  };
})();


/* ---- boot + main loop ---- */
// Page chrome from the theme: title, colours, icons, footer.
{
  const TH = CONFIG.theme, head = document.head;
  const meta = (name, content) => {
    let m = head.querySelector(`meta[name="${name}"]`);
    if (!m) { m = document.createElement('meta'); m.name = name; head.appendChild(m); }
    m.content = content;
  };
  const link = (rel, href) => {
    let l = head.querySelector(`link[rel="${rel}"]`);

}
const saved = Storage.load();
Engine.loadSave(saved);
Input.setTouchMode(saved && saved.touchMode);
Sound.setMuted(Engine.state.muted);
// Saved settings = the engine's data (scores, mute, initials) + the touch layer's mode.
const saveAll = () => Storage.save({ ...Engine.saveData(), touchMode: Input.touchMode() });
Input.onSettingsChanged(saveAll);
window.Chompers = { CONFIG, MODES, MathUtil, PROFILES, THEMES, selectGame,
                    CAMPAIGN: CONFIG.profile.campaign, ENEMY_TYPES: CONFIG.profile.enemyTypes,
                    Engine, Render, Input, Sound, Storage };
Input.layout();
Render.canvas.focus();

// Engine events -> sound, saving, hit-stop.
let hitStop = 0;
function handleEvents() {
  for (const ev of Engine.drainEvents()) {
    if (ev === 'save') { saveAll(); continue; }
    if (ev === 'mute') { Sound.setMuted(Engine.state.muted); saveAll(); Sound.play('menu'); continue; }
    Sound.play(ev);
    if (ev === 'correct' && CONFIG.profile.feel.hitStop) hitStop = CONFIG.profile.feel.hitStopFrames;
  }
}

// One frame of game time. Returns false when hit-stop held the world still.
function step(dt) {
  handleEvents();                       // events from key presses since the last frame
  let ran = true;
  if (hitStop > 0) { hitStop--; ran = false; } // profile.feel.hitStop
  else Engine.update(dt);
  handleEvents();                       // events from this update (spawns, deaths, ...)
  return ran;
}
window.Chompers.Loop = { step };

let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last);
  last = now;
  Input.update(dt);                     // tap-to-move steps, touch button visibility
  step(dt);
  Render.draw(Engine.state, now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// PWA: the theme's manifest + an offline service worker for this game, only when
// served over http(s). Opening chompers.html straight from disk works as before.
if (/^https?:$/.test(location.protocol)) {
  const TH = CONFIG.theme;
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = TH.manifest;
  document.head.appendChild(link);
  if ('serviceWorker' in navigator) {
    const q = new URLSearchParams({ v: CONFIG.version, cache: TH.cacheName, manifest: TH.manifest });
    navigator.serviceWorker.register('sw.js?' + q, { updateViaCache: 'none' })
      .catch(err => console.warn('Service worker not registered:', err));
  }
}
</script>
</body>
