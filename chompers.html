<canvas id="screen" width="320" height="200" tabindex="0"></canvas>
<footer id="footer">not affiliated with Number Munchers™ / MECC · for personal play.</footer>
<script>
"use strict";

/* =====================================================================
 * 1. CONFIG / DATA
 *    Everything tunable lives here. Edit freely by hand.
 * ===================================================================== */

const CONFIG = {
  title: 'Chompers',                 // rename the game here (+ <title> tag)
  view: { width: 320, height: 200 }, // logical canvas resolution
  grid: { cols: 6, rows: 5 },
  startLives: 3,
  // Title-screen menu, top to bottom: 'campaign' plays CAMPAIGN in order; a mode id
  // is practice: only that mode's CAMPAIGN stages, then the same escalation.
  menu: ['campaign', 'multiples', 'factors', 'primes', 'equals'],

  scoring: {
    correct: 5,       // points per correct eat, multiplied by level
    levelBonus: 10,   // bonus on level clear, multiplied by level
  },

  board: {
    correctRatio: 0.45, // chance each cell is a correct answer
    minCorrect: 6,      // guarantee at least this many correct cells
    maxChars: 6,        // longest cell text (numbers or expressions); RENDER fits up to 6
  },

  timing: {             // milliseconds
    wrongLock: 1500,    // input locked + error message shown after a wrong eat
    goodFlash: 450,     // "+points" pop after a correct eat
    chomp: 180,         // mouth-open animation
    levelClear: 1800,   // "level clear" banner before next level
    gameOverGuard: 700, // ignore input briefly on game-over screen
    deathLock: 1100,    // input locked + death animation after a Grump catches you
    rewriteFlash: 350,  // highlight on a cell whose number a Grump just changed
  },

  enemies: {
    maxOnScreen: 6,             // hard cap, whatever a stage asks for (escalation grows toward it)
    spawnMinDistance: 3,        // spawn edge cell must be at least this many steps from the player
    freezeDuringWrongEat: true, // Grumps (and their spawn / safe-cell timers) hold still during the wrong-eat lockout
    rewriteEaten: false,        // number-altering Grumps also refill already-eaten (empty) cells
  },

  safeCell: {          // milliseconds; turn it off per level with safeCell:false
    firstDelay: 4000,  // after level start, before the first safe cell appears
    duration: 6000,    // how long a safe cell lasts
    cooldown: 6000,    // gap before the next one appears
    blinkBefore: 1500, // marker blinks during its last this-many ms
  },

  // Past the last stage of a track the game does NOT loop. With k = stage - trackLength
  // (1, 2, 3, ...), modes keep cycling through the track's stages in order, and
  // difficulty comes from this formula ("last" = the track's final stage):
  //   rangeScale   = min(rangeMax, 1 + rangeStep * k)      passed to the mode's widen()
  //   Grumps       = min(enemies.maxOnScreen, last.count + floor(k / extraEnemyEvery))
  //   tickMult     = max(min(tickFloor, last), last.tickMult * tickDecay^k)
  //   safe cell    = on, lasting max(min(safeFloor, base), safeCell.duration * safeDecay^k) ms
  //   Grump types  = types;  spawnDelay = last.spawnDelay (or spawnDelay below if it has none)
  escalation: {
    rangeStep: 0.1, rangeMax: 3,
    extraEnemyEvery: 4,
    tickDecay: 0.97, tickFloor: 0.45,
    safeDecay: 0.93, safeFloor: 2500,
    types: ['wanderer', 'stalker', 'stalker'],
    spawnDelay: 3000,
    maxNumber: 999,  // widened ranges never exceed this (keeps numbers to 3 characters)
    maxOperand: 99,  // widened expression operands never exceed this
  },

  palette: {
    bg:         '#141226',
    panel:      '#1f1b3a',
    cell:       '#2a2552',
    cellEdge:   '#463e8c',
    cellEaten:  '#18152f',
    number:     '#ece8ff',
    dim:        '#8a86a8',
    accent:     '#ffd25a',
    good:       '#5de08a',
    bad:        '#ff5a6e',
    safeFill:   '#1d4560',
    safeEdge:   '#7fd8ff',
    rewrite:    '#ffd25a',
    // creature
    outline:    '#0e0c1c',
    body:       '#42c6a8',
    bodyHurt:   '#ff7a88',
    eye:        '#ffffff',
    mouth:      '#0e0c1c',
    tooth:      '#ffffff',
  },
};

// ---- small pure math helpers used by MODES ----
const MathUtil = {
  isPrime(v) {
    if (!Number.isInteger(v) || v < 2) return false;
    for (let d = 2; d * d <= v; d++) if (v % d === 0) return false;
    return true;
  },
  factors(n) {
    const out = [];
    for (let d = 1; d <= n; d++) if (n % d === 0) out.push(d);
    return out;
  },
  // "a<op>b" with op one of + − × ÷  ->  its integer value, or NaN if malformed
  // or not a whole number. (ASCII - * x / are accepted too.)
  evalExpr(s) {
    const m = /^(\d+)\s*([+\-−×x*÷/])\s*(\d+)$/.exec(String(s));
    if (!m) return NaN;
    const a = Number(m[1]), b = Number(m[3]);
    switch (m[2]) {
      case '+': return a + b;
      case '-': case '−': return a - b;
      case 'x': case '*': case '×': return a * b;
      default: return b !== 0 && a % b === 0 ? a / b : NaN;
    }
  },
  pick: (list, rnd) => list[rnd(0, list.length - 1)],
};

// A mode = a rule for which cells are "correct". Four required functions:
//   title(p)                  -> header text for level params p         ("header")
//   isCorrect(value, p)       -> boolean
//   makeValue(p, want, rnd)   -> a cell value that is correct iff want   ("generate")
//                                (may return null if it can't make one; the engine retries)
//   explain(value, p)         -> short message shown after a wrong eat  ("wrongMessage")
// Optional:
//   name                      -> label for menus / game-over screen
//   setup(p, rnd)             -> turns stage params into concrete params once per level
//                                (e.g. picks N from a list). Default: use them as-is.
//   widen(p, f)               -> stage params with ranges widened by factor f >= 1, used
//                                past the end of a track (CONFIG.escalation). Default: unchanged.
// Cell values may be numbers or short strings (expressions); uniqueness on a board is by
// displayed text, and every value must fit in board.maxChars characters.
// rnd(lo, hi) returns an integer in [lo, hi].
const pickN = (p, rnd) => ({ ...p, n: Array.isArray(p.ns) ? MathUtil.pick(p.ns, rnd) : p.n });
const widenMax = (p, f) => ({ ...p, max: Math.min(CONFIG.escalation.maxNumber, Math.round(p.max * f)) });

const MODES = {
  multiples: {
    name: 'Multiples',
    widen: widenMax,
    title: p => `Multiples of ${p.n}`,
    isCorrect: (v, p) => v % p.n === 0,
    makeValue(p, want, rnd) {
      if (want) return p.n * rnd(1, Math.floor(p.max / p.n));
      let v;
      do { v = rnd(1, p.max); } while (v % p.n === 0);
      return v;
    },
    explain: (v, p) => `${v} is not a multiple of ${p.n}`,
  },

  // Stage params: ns (list of N to pick from, or n), max (largest number shown).
  factors: {
    name: 'Factors',
    // Chance a WRONG cell is drawn from each near-miss pool; the rest is random fill.
    nearMiss: {
      neighbours: 0.3,     // factors of N-1 and N+1 that don't divide N
      primeMultiples: 0.4, // multiples of 2, 3, 5, 7 that don't divide N
    },
    setup: pickN,
    widen: widenMax, // wider range of distractors; N itself still comes from ns
    title: p => `Factors of ${p.n}`,
    isCorrect: (v, p) => v >= 1 && p.n % v === 0,
    makeValue(p, want, rnd) {
      if (want) return MathUtil.pick(MathUtil.factors(p.n), rnd);
      const ok = v => v >= 1 && v <= p.max && p.n % v !== 0;
      const r = Math.random();
      let pool = null;
      if (r < this.nearMiss.neighbours) {
        pool = [...MathUtil.factors(p.n - 1), ...MathUtil.factors(p.n + 1)];
      } else if (r < this.nearMiss.neighbours + this.nearMiss.primeMultiples) {
        pool = [];
        for (const q of [2, 3, 5, 7]) for (let v = q; v <= p.max; v += q) pool.push(v);
      }
      if (pool) {
        pool = pool.filter(ok);
        if (pool.length) return MathUtil.pick(pool, rnd);
      }
      let v;
      do { v = rnd(1, p.max); } while (!ok(v));
      return v;
    },
    explain: (v, p) => `${v} is not a factor of ${p.n}`,
  },

  // Stage params: max (numbers 1..max).
  primes: {
    name: 'Primes',
    // Chance a WRONG cell is a near-miss: 1 or an odd composite (9, 15, 21, 27, 33, 39, 49, 51, 57, 91...).
    nearMissChance: 0.6,
    widen: widenMax,
    title: () => 'Primes',
    isCorrect: v => MathUtil.isPrime(v),
    makeValue(p, want, rnd) {
      let v;
      if (want) {
        do { v = rnd(2, p.max); } while (!MathUtil.isPrime(v));
        return v;
      }
      if (Math.random() < this.nearMissChance) {
        const pool = [1];
        for (let x = 9; x <= p.max; x += 2) if (!MathUtil.isPrime(x)) pool.push(x);
        return MathUtil.pick(pool, rnd);
      }
      do { v = rnd(1, p.max); } while (MathUtil.isPrime(v));
      return v;
    },
    explain(v) {
      if (v < 2) return `${v} is not prime`;
      let d = 2;
      while (v % d) d++;
      return `${v} = ${d}×${v / d}, not prime`;
    },
  },

  // Stage params: variant ('eq' | 'lt' | 'gt'), ns (targets to pick from, or n),
  //   ops (any of '+', '−', '×', '÷'), operand [lo, hi].
  // Cells are expressions "a op b". Both operands come from the operand range,
  // except ÷, where the divisor and the RESULT do (so the dividend can be larger).
  // Subtraction never goes negative; division is always exact.
  equals: {
    name: 'Equals/Inequality',
    variants: { eq: 'Equal to', lt: 'Less than', gt: 'Greater than' },
    nearMissChance: 0.5, // chance a WRONG cell's value lands within nearMissSpread of N
    nearMissSpread: 3,
    setup: pickN,
    // larger operands; for less/greater-than the target N scales too (equal-to keeps N)
    widen(p, f) {
      const scaleN = n => (p.variant === 'eq' ? n : Math.round(n * f));
      const hi = Math.min(CONFIG.escalation.maxOperand, Math.max(p.operand[1], Math.round(p.operand[1] * f)));
      const out = { ...p, operand: [p.operand[0], hi] };
      if (Array.isArray(p.ns)) out.ns = p.ns.map(scaleN);
      if (p.n !== undefined) out.n = scaleN(p.n);
      return out;
    },
    title(p) { return `${this.variants[p.variant]} ${p.n}`; },
    isCorrect(v, p) {
      const x = MathUtil.evalExpr(v);
      if (p.variant === 'lt') return x < p.n;
      if (p.variant === 'gt') return x > p.n;
      return x === p.n;
    },
    randomExpr(p, rnd) {
      const [lo, hi] = p.operand;
      const op = MathUtil.pick(p.ops, rnd);
      let a = rnd(lo, hi), b = rnd(lo, hi);
      if (op === '−' && a < b) [a, b] = [b, a];
      if (op === '÷') { b = Math.max(1, b); a *= b; } // a was the quotient
      const s = `${a}${op}${b}`;
      return s.length <= CONFIG.board.maxChars ? s : null;
    },
    makeValue(p, want, rnd) {
      const near = !want && Math.random() < this.nearMissChance;
      for (let i = 0; i < 400; i++) {
        const s = this.randomExpr(p, rnd);
        if (s === null || this.isCorrect(s, p) !== want) continue;
        if (near && i < 200 && Math.abs(MathUtil.evalExpr(s) - p.n) > this.nearMissSpread) continue;
        return s;
      }
      return null;
    },
    explain(v, p) {
      return `${v} = ${MathUtil.evalExpr(v)}, not ${this.variants[p.variant].toLowerCase()} ${p.n}`;
    },
  },
};

// Enemies ("Grumps"). Each type:
//   name           shown when it catches you
//   color          body colour of its sprite
//   tickMs         ms between steps (multiplied by the level's tickMult)
//   altersNumbers  true = rewrites the number in every cell it steps on
//   move(e, w, t)  returns a direction [dc, dr] to step, or null to stay put
//                  e: { col, row, dir }   t: this type entry (for its tunables)
//                  w: { cols, rows, player:{col,row}, dirs, canEnter(c,r), random(), rnd(lo,hi) }
//                  Only directions where w.canEnter(...) is true are legal
//                  (inside the grid and not the safe cell). Anything else is ignored.
const ENEMY_TYPES = {
  wanderer: {
    name: 'Wanderer',
    color: '#f0913c',
    tickMs: 800,
    altersNumbers: true,
    straightBias: 0.7, // chance to keep its current heading when it can
    move(e, w, t) {
      const open = w.dirs.filter(d => w.canEnter(e.col + d[0], e.row + d[1]));
      if (!open.length) return null;
      const ahead = open.find(d => d[0] === e.dir[0] && d[1] === e.dir[1]);
      if (ahead && w.random() < t.straightBias) return ahead;
      const noReverse = open.filter(d => !(d[0] === -e.dir[0] && d[1] === -e.dir[1]));
      const pool = noReverse.length ? noReverse : open;
      return pool[w.rnd(0, pool.length - 1)];
    },
  },
  stalker: {
    name: 'Stalker',
    color: '#d062e8',
    tickMs: 1000,
    altersNumbers: false,
    randomStepChance: 0.3, // chance a step is random instead of toward the player
    move(e, w, t) {
      const open = w.dirs.filter(d => w.canEnter(e.col + d[0], e.row + d[1]));
      if (!open.length) return null;
      if (w.random() < t.randomStepChance) return open[w.rnd(0, open.length - 1)];
      const dist = d => Math.abs(e.col + d[0] - w.player.col) + Math.abs(e.row + d[1] - w.player.row);
      const best = Math.min(...open.map(dist));
      const pick = open.filter(d => dist(d) === best);
      return pick[w.rnd(0, pick.length - 1)];
    },
  },
};


// The campaign: one stage per level, played in order. Each stage:
//   mode      id from MODES
//   params    that mode's level params (see each mode above)
//   enemies   { count, types, spawnDelay, tickMult }  (omit for no Grumps)
//             count      Grumps on the board at once (also capped by enemies.maxOnScreen)
//             types      ids from ENEMY_TYPES; each spawn picks one at random (repeat an id to weight it)
//             spawnDelay ms before the first spawn, between spawns, and after a respawn
//             tickMult   multiplies every Grump's tick interval (smaller = faster)
//   safeCell  true/false: whether safe cells appear (they last safeCell.duration)
// Modes rotate, and each mode's first stage is its gentlest. Practice mode plays
// only one mode's stages from this list. Past the end: see CONFIG.escalation.
// Every stage needs enough values for a unique 30-cell board with >= board.minCorrect
// correct ones (the headless test checks every stage).
const W1 = { types: ['wanderer'] }, WS = { types: ['wanderer', 'stalker'] }, WSS = { types: ['wanderer', 'stalker', 'stalker'] };
const CAMPAIGN = [
  /*  1 */ { mode: 'multiples', params: { n: 2, max: 50 },                                                 safeCell: false },
  /*  2 */ { mode: 'multiples', params: { n: 5, max: 100 },                                                safeCell: false },
  /*  3 */ { mode: 'factors',   params: { ns: [12], max: 40 },                                             safeCell: true, enemies: { count: 1, ...W1,  spawnDelay: 4000, tickMult: 1.0 } },
  /*  4 */ { mode: 'primes',    params: { max: 30 },                                                       safeCell: true, enemies: { count: 1, ...W1,  spawnDelay: 4000, tickMult: 1.0 } },
  /*  5 */ { mode: 'equals',    params: { variant: 'eq', ns: [10, 12], ops: ['+', '−'], operand: [1, 15] }, safeCell: true, enemies: { count: 1, ...W1,  spawnDelay: 4000, tickMult: 1.0 } },
  /*  6 */ { mode: 'multiples', params: { n: 3, max: 60 },                                                 safeCell: true, enemies: { count: 2, ...W1,  spawnDelay: 3500, tickMult: 1.0 } },
  /*  7 */ { mode: 'factors',   params: { ns: [24], max: 60 },                                             safeCell: true, enemies: { count: 2, ...WS,  spawnDelay: 3500, tickMult: 1.0 } },
  /*  8 */ { mode: 'equals',    params: { variant: 'lt', ns: [10, 12], ops: ['+', '−'], operand: [1, 12] }, safeCell: true, enemies: { count: 2, ...WS,  spawnDelay: 3500, tickMult: 1.0 } },
  /*  9 */ { mode: 'primes',    params: { max: 50 },                                                       safeCell: true, enemies: { count: 2, ...WS,  spawnDelay: 3000, tickMult: 0.95 } },
  /* 10 */ { mode: 'multiples', params: { n: 4, max: 80 },                                                 safeCell: true, enemies: { count: 2, ...WS,  spawnDelay: 3000, tickMult: 0.9 } },
  /* 11 */ { mode: 'equals',    params: { variant: 'gt', ns: [15, 20], ops: ['+', '−', '×'], operand: [1, 10] }, safeCell: true, enemies: { count: 3, ...WS, spawnDelay: 3000, tickMult: 0.9 } },
  /* 12 */ { mode: 'factors',   params: { ns: [30, 36], max: 80 },                                         safeCell: true, enemies: { count: 3, ...WS,  spawnDelay: 3000, tickMult: 0.9 } },
  /* 13 */ { mode: 'multiples', params: { n: 6, max: 120 },                                                safeCell: true, enemies: { count: 3, ...WS,  spawnDelay: 2750, tickMult: 0.9 } },
  /* 14 */ { mode: 'primes',    params: { max: 75 },                                                       safeCell: true, enemies: { count: 3, ...WSS, spawnDelay: 2750, tickMult: 0.85 } },
  /* 15 */ { mode: 'equals',    params: { variant: 'eq', ns: [12, 24], ops: ['×', '+'], operand: [1, 12] }, safeCell: true, enemies: { count: 3, ...WSS, spawnDelay: 2750, tickMult: 0.85 } },
  /* 16 */ { mode: 'multiples', params: { n: 9, max: 180 },                                                safeCell: true, enemies: { count: 3, ...WSS, spawnDelay: 2500, tickMult: 0.85 } },
  /* 17 */ { mode: 'factors',   params: { ns: [48], max: 100 },                                            safeCell: true, enemies: { count: 4, ...WS,  spawnDelay: 2500, tickMult: 0.8 } },
  /* 18 */ { mode: 'equals',    params: { variant: 'lt', ns: [30], ops: ['×', '÷'], operand: [2, 10] },    safeCell: true, enemies: { count: 4, ...WS,  spawnDelay: 2500, tickMult: 0.8 } },
  /* 19 */ { mode: 'primes',    params: { max: 100 },                                                      safeCell: true, enemies: { count: 4, ...WSS, spawnDelay: 2250, tickMult: 0.8 } },
  /* 20 */ { mode: 'multiples', params: { n: 7, max: 140 },                                                safeCell: true, enemies: { count: 4, ...WSS, spawnDelay: 2250, tickMult: 0.75 } },
  /* 21 */ { mode: 'factors',   params: { ns: [60, 72], max: 120 },                                        safeCell: true, enemies: { count: 4, ...WSS, spawnDelay: 2000, tickMult: 0.75 } },
  /* 22 */ { mode: 'equals',    params: { variant: 'gt', ns: [50], ops: ['+', '−', '×', '÷'], operand: [2, 12] }, safeCell: true, enemies: { count: 4, ...WSS, spawnDelay: 2000, tickMult: 0.75 } },
];


/* =====================================================================
 * 2. ENGINE
 *    Pure game state + rules. No DOM / canvas / keyboard here.
 *    Driven by Engine.handle(action) and Engine.update(dtMs).
 *    Actions: up down left right eat pause confirm blur
 * ===================================================================== */

const Engine = (() => {
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const DIR_LIST = Object.values(DIRS);
  const rnd = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const NO_ENEMIES = { count: 0, types: [], spawnDelay: 0, tickMult: 1 };

  const state = {
    screen: 'title',      // title | playing | paused | levelclear | gameover
    menuIndex: 0,         // selected title-menu entry (index into CONFIG.menu)
    track: 'campaign',    // 'campaign' or a mode id (practice)
    stage: null,          // stageFor(track, level): resolved stage settings
    modeId: null,         // mode of the current stage
    params: null,         // current level params (after the mode's setup)
    level: 1,             // stage number within the track (1-based)
    score: 0,
    lives: CONFIG.startLives,
    cells: [],            // [{ value, eaten, fxT }], row-major; fxT = rewrite highlight
    remaining: 0,         // correct cells left on the board
    player: { col: 0, row: 0, chompT: 0 },
    lockT: 0,             // input lock remaining (ms)
    lockKind: null,       // 'wrong' | 'death' while lockT > 0
    screenT: 0,           // timer for levelclear / gameover
    flash: null,          // { kind:'good'|'bad'|'dead', t, dur, cell, msg }
    lastBonus: 0,
    // --- enemies / safe cell ---
    enemyCfg: NO_ENEMIES, // this level's `enemies` settings
    enemies: [],          // [{ id, type, col, row, dir:[dc,dr], tickT, animT }]
    nextEnemyId: 1,
    spawnT: 0,            // ms until next spawn attempt
    safeOn: false,        // safe cells enabled on this level
    safeDuration: 0,      // how long a safe cell lasts on this level (ms)
    safe: null,           // { col, row, t, dur } while a safe cell is up
    safeT: 0,             // ms until the next safe cell appears (while none is up)
  };

  const mode = () => MODES[state.modeId];
  const idx = (c, r) => r * CONFIG.grid.cols + c;
  const inGrid = (c, r) => c >= 0 && r >= 0 && c < CONFIG.grid.cols && r < CONFIG.grid.rows;
  const isSafe = (c, r) => !!state.safe && state.safe.col === c && state.safe.row === r;
  const enemyAt = (c, r) => state.enemies.find(e => e.col === c && e.row === r);
  const typeOf = e => ENEMY_TYPES[e.type];
  const interval = t => t.tickMs * (state.enemyCfg.tickMult || 1);

  // ---------- campaign / practice tracks ----------
  // A track is the list of stages one game plays: all of CAMPAIGN, or (practice)
  // only the CAMPAIGN stages of one mode.
  function trackStages(track) {
    const list = track === 'campaign' ? CAMPAIGN : CAMPAIGN.filter(st => st.mode === track);
    if (!list.length) throw new Error(`No CAMPAIGN stages for track "${track}"`);
    return list;
  }
  const trackLabel = track => (track === 'campaign' ? 'Campaign' : `Practice: ${MODES[track].name}`);

  // Resolved settings for stage `level` of a track. Pure: no randomness, no state.
  // Within the list: the stage as configured. Past the end (k = level - length):
  // modes keep cycling through the list, difficulty follows CONFIG.escalation.
  function stageFor(track, level) {
    const list = trackStages(track), len = list.length;
    const withDefaults = e => ({ ...NO_ENEMIES, ...(e || {}) });
    if (level <= len) {
      const st = list[level - 1];
      return { modeId: st.mode, params: { ...st.params }, enemies: withDefaults(st.enemies),
               safeCell: !!st.safeCell, safeDuration: CONFIG.safeCell.duration, rangeScale: 1, k: 0 };
    }
    const X = CONFIG.escalation, k = level - len;
    const base = list[(k - 1) % len], last = withDefaults(list[len - 1].enemies), m = MODES[base.mode];
    const rangeScale = Math.min(X.rangeMax, 1 + X.rangeStep * k);
    const lastTick = last.tickMult || 1, baseSafe = CONFIG.safeCell.duration;
    return {
      modeId: base.mode,
      params: m.widen ? m.widen({ ...base.params }, rangeScale) : { ...base.params },
      enemies: {
        count: Math.min(CONFIG.enemies.maxOnScreen, last.count + Math.floor(k / X.extraEnemyEvery)),
        types: X.types,
        spawnDelay: last.spawnDelay || X.spawnDelay,
        tickMult: Math.max(Math.min(X.tickFloor, lastTick), lastTick * Math.pow(X.tickDecay, k)),
      },
      safeCell: true,
      safeDuration: Math.max(Math.min(X.safeFloor, baseSafe), baseSafe * Math.pow(X.safeDecay, k)),
      rangeScale, k,
    };
  }

  // ---------- numbers ----------
  // A value not in `used` whose correctness == want, or null if none turns up.
  // (Small ranges, e.g. primes to 30 on a 30-cell board, need many tries for the last cells.)
  function uniqueValue(want, used) {
    const m = mode();
    for (let tries = 0; tries < 2000; tries++) {
      const v = m.makeValue(state.params, want, rnd);
      if (v !== null && v !== undefined && !used.has(v)) return v;
    }
    return null;
  }

  function countRemaining() {
    const m = mode(), p = state.params;
    return state.cells.filter(c => !c.eaten && m.isCorrect(c.value, p)).length;
  }

  function buildBoard() {
    const { cols, rows } = CONFIG.grid;
    const total = cols * rows;
    const want = [];
    for (let i = 0; i < total; i++) want.push(Math.random() < CONFIG.board.correctRatio);
    let count = want.filter(Boolean).length;
    const minC = Math.min(CONFIG.board.minCorrect, total);
    while (count < minC) {
      const i = rnd(0, total - 1);
      if (!want[i]) { want[i] = true; count++; }
    }
    const used = new Set();
    const exhausted = { true: false, false: false }; // stop asking for a kind the range has run out of
    const draw = w => {
      if (exhausted[w]) return null;
      const v = uniqueValue(w, used);
      if (v === null) exhausted[w] = true;
      return v;
    };
    state.cells = want.map(w => {
      const v = draw(w) ?? draw(!w);
      if (v === null) throw new Error(`${trackLabel(state.track)} stage ${state.level}: number range too small for ${total} unique cells`);
      used.add(v);
      return { value: v, eaten: false, fxT: 0 };
    });
    state.remaining = countRemaining();
    if (state.remaining < minC) console.warn(`${trackLabel(state.track)} stage ${state.level}: only ${state.remaining} correct cells (board.minCorrect is ${minC}); widen this stage's range`);
  }

  // A number-altering Grump stepped on cell i: give it a new number that is
  // unique on the board. Never lets the correct-cell count drop below
  // board.minCorrect (or to zero), so a rewrite can't strand or end a level.
  function rewriteCell(i) {
    const cell = state.cells[i];
    if (cell.eaten && !CONFIG.enemies.rewriteEaten) return;
    const m = mode(), p = state.params;
    const wasCorrect = !cell.eaten && m.isCorrect(cell.value, p);
    const mustBeCorrect = wasCorrect && state.remaining - 1 < Math.max(1, CONFIG.board.minCorrect);
    const used = new Set();
    state.cells.forEach((c, j) => { if (!c.eaten || j === i) used.add(c.value); });
    const want = mustBeCorrect || Math.random() < CONFIG.board.correctRatio;
    let v = uniqueValue(want, used);
    if (v === null && !mustBeCorrect) v = uniqueValue(!want, used);
    if (v === null) return; // range exhausted: leave the cell as it is
    cell.value = v;
    cell.eaten = false;
    cell.fxT = CONFIG.timing.rewriteFlash;
    state.remaining = countRemaining();
  }

  // ---------- level flow ----------
  function centrePlayer() {
    state.player.col = Math.floor(CONFIG.grid.cols / 2);
    state.player.row = Math.floor(CONFIG.grid.rows / 2);
  }

  function startLevel() {
    const st = stageFor(state.track, state.level);
    state.stage = st;
    state.modeId = st.modeId;
    state.params = mode().setup ? mode().setup(st.params, rnd) : st.params;
    buildBoard();
    centrePlayer();
    state.player.chompT = 0;
    state.lockT = 0;
    state.lockKind = null;
    state.flash = null;
    state.enemyCfg = st.enemies;
    state.enemies = [];
    state.spawnT = state.enemyCfg.spawnDelay;
    state.safeOn = st.safeCell;
    state.safeDuration = st.safeDuration;
    state.safe = null;
    state.safeT = CONFIG.safeCell.firstDelay;
    state.screen = 'playing';
  }

  function newGame(track) {
    state.track = track;
    state.level = 1;
    state.score = 0;
    state.lives = CONFIG.startLives;
    startLevel();
  }

  // ---------- player ----------
  function move(dir) {
    const [dx, dy] = DIRS[dir];
    const p = state.player;
    p.col = Math.max(0, Math.min(CONFIG.grid.cols - 1, p.col + dx));
    p.row = Math.max(0, Math.min(CONFIG.grid.rows - 1, p.row + dy));
    checkCollision();
  }

  function eat() {
    const p = state.player, i = idx(p.col, p.row), cell = state.cells[i];
    if (cell.eaten) return;
    p.chompT = CONFIG.timing.chomp;
    if (mode().isCorrect(cell.value, state.params)) {
      cell.eaten = true;
      const pts = CONFIG.scoring.correct * state.level;
      state.score += pts;
      state.remaining--;
      state.flash = { kind: 'good', t: CONFIG.timing.goodFlash, dur: CONFIG.timing.goodFlash, cell: i, msg: '+' + pts };
      if (state.remaining <= 0) {
        state.lastBonus = CONFIG.scoring.levelBonus * state.level;
        state.score += state.lastBonus;
        state.screen = 'levelclear';
        state.screenT = CONFIG.timing.levelClear;
      }
    } else {
      state.lives--;
      state.flash = { kind: 'bad', t: CONFIG.timing.wrongLock, dur: CONFIG.timing.wrongLock, cell: i,
                      msg: mode().explain(cell.value, state.params) };
      state.lockT = CONFIG.timing.wrongLock;
      state.lockKind = 'wrong';
    }
  }

  // ---------- collision / death ----------
  function checkCollision() {
    if (state.screen !== 'playing' || state.lockKind === 'death' || state.lives <= 0) return;
    const p = state.player;
    if (isSafe(p.col, p.row)) return;
    const e = enemyAt(p.col, p.row);
    if (e) die(e);
  }

  // Same lockout pattern as a wrong eat, with its own timer and message.
  function die(e) {
    const t = CONFIG.timing.deathLock;
    state.lives--;
    state.lockT = t;
    state.lockKind = 'death';
    state.player.chompT = 0;
    state.flash = { kind: 'dead', t, dur: t, cell: idx(state.player.col, state.player.row),
                    msg: `${typeOf(e).name} got you!` };
  }

  function endLock() {
    const kind = state.lockKind;
    state.lockT = 0;
    state.lockKind = null;
    if (state.lives <= 0) { state.screen = 'gameover'; state.screenT = CONFIG.timing.gameOverGuard; return; }
    if (kind === 'death') {
      state.enemies = [];
      centrePlayer();
      state.spawnT = state.enemyCfg.spawnDelay;
    } else {
      checkCollision(); // an unfrozen Grump may have walked in during the wrong-eat lock
    }
  }

  // ---------- enemies ----------
  function inwardDir(c, r) {
    if (c === 0) return [1, 0];
    if (c === CONFIG.grid.cols - 1) return [-1, 0];
    if (r === 0) return [0, 1];
    return [0, -1];
  }

  function addEnemy(typeId, col, row, dir) {
    const t = ENEMY_TYPES[typeId];
    if (!t) throw new Error(`Unknown enemy type "${typeId}"`);
    const e = { id: state.nextEnemyId++, type: typeId, col, row,
                dir: dir || inwardDir(col, row), tickT: interval(t), animT: 0 };
    state.enemies.push(e);
    return e;
  }

  function spawnEnemy() {
    const { cols, rows } = CONFIG.grid, p = state.player, cells = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const edge = c === 0 || r === 0 || c === cols - 1 || r === rows - 1;
      const far = Math.abs(c - p.col) + Math.abs(r - p.row) >= CONFIG.enemies.spawnMinDistance;
      if (edge && far && !isSafe(c, r)) cells.push([c, r]);
    }
    if (!cells.length) return false;
    const [c, r] = cells[rnd(0, cells.length - 1)];
    const types = state.enemyCfg.types;
    addEnemy(types[rnd(0, types.length - 1)], c, r);
    return true;
  }

  function updateSpawns(dt) {
    const cfg = state.enemyCfg;
    const cap = Math.min(cfg.count, CONFIG.enemies.maxOnScreen);
    if (state.enemies.length >= cap || !cfg.types.length) return;
    state.spawnT -= dt;
    if (state.spawnT > 0) return;
    if (spawnEnemy()) state.spawnT = cfg.spawnDelay; // else retry next frame
  }

  function world() {
    return {
      cols: CONFIG.grid.cols, rows: CONFIG.grid.rows,
      player: { col: state.player.col, row: state.player.row },
      dirs: DIR_LIST.map(d => d.slice()),
      canEnter: (c, r) => inGrid(c, r) && !isSafe(c, r),
      random: Math.random,
      rnd,
    };
  }

  function updateEnemies(dt) {
    const w = world();
    for (const e of state.enemies) {
      e.animT += dt;
      e.tickT -= dt;
      if (e.tickT > 0) continue;
      const t = typeOf(e);
      e.tickT += interval(t);
      const d = t.move(e, w, t);
      const legal = d && DIR_LIST.some(x => x[0] === d[0] && x[1] === d[1]) && w.canEnter(e.col + d[0], e.row + d[1]);
      if (legal) {
        e.col += d[0]; e.row += d[1]; e.dir = [d[0], d[1]];
        if (t.altersNumbers) rewriteCell(idx(e.col, e.row));
      }
      checkCollision();
      if (state.lockKind === 'death') break; // world freezes for the death animation
    }
  }

  // ---------- safe cell ----------
  function placeSafe() {
    const free = [];
    for (let r = 0; r < CONFIG.grid.rows; r++)
      for (let c = 0; c < CONFIG.grid.cols; c++) if (!enemyAt(c, r)) free.push([c, r]);
    if (!free.length) return; // retry next frame
    const [c, r] = free[rnd(0, free.length - 1)];
    state.safe = { col: c, row: r, t: state.safeDuration, dur: state.safeDuration };
  }

  function updateSafe(dt) {
    if (!state.safeOn) return;
    if (state.safe) {
      state.safe.t -= dt;
      if (state.safe.t <= 0) { state.safe = null; state.safeT = CONFIG.safeCell.cooldown; }
    } else {
      state.safeT -= dt;
      if (state.safeT <= 0) placeSafe();
    }
  }

  // ---------- actions + time ----------
  function handle(action) {
    const s = state;
    if (action === 'blur') { if (s.screen === 'playing') s.screen = 'paused'; return; }
    const go = action === 'eat' || action === 'confirm';
    switch (s.screen) {
      case 'title':
        if (action === 'up' || action === 'down') {
          const n = CONFIG.menu.length;
          s.menuIndex = (s.menuIndex + (action === 'down' ? 1 : n - 1)) % n;
        } else if (go) newGame(CONFIG.menu[s.menuIndex]);
        break;
      case 'gameover': if (go && s.screenT <= 0) s.screen = 'title'; break;
      case 'paused':   if (action === 'pause' || go) s.screen = 'playing'; break;
      case 'levelclear': break;
      case 'playing':
        if (action === 'pause') { s.screen = 'paused'; return; }
        if (s.lockT > 0) return;
        if (DIRS[action]) move(action);
        else if (action === 'eat') eat();
        break;
    }
  }

  function tickCommon(dt) {
    const s = state;
    if (s.player.chompT > 0) s.player.chompT = Math.max(0, s.player.chompT - dt);
    if (s.flash) { s.flash.t -= dt; if (s.flash.t <= 0) s.flash = null; }
    for (const c of s.cells) if (c.fxT > 0) c.fxT = Math.max(0, c.fxT - dt);
  }

  // Only 'playing' advances enemies, spawns and the safe cell, so pause
  // (and the level-clear banner) freezes all of them.
  function update(dt) {
    const s = state;
    if (s.screen === 'playing') {
      tickCommon(dt);
      const frozen = s.lockT > 0 && (s.lockKind === 'death' || CONFIG.enemies.freezeDuringWrongEat);
      if (s.lockT > 0) {
        s.lockT -= dt;
        if (s.lockT <= 0) endLock();
      }
      if (!frozen && s.screen === 'playing') {
        updateSafe(dt);
        updateSpawns(dt);
        updateEnemies(dt);
      }
    } else if (s.screen === 'levelclear') {
      tickCommon(dt);
      s.screenT -= dt;
      if (s.screenT <= 0) { s.level++; startLevel(); }
    } else if (s.screen === 'gameover') {
      if (s.screenT > 0) s.screenT -= dt;
    }
  }

  // ---------- test / debug hooks (never called by the game itself) ----------
  const debug = {
    gotoLevel(n, track = 'campaign') { newGame(track); state.level = n; startLevel(); },
    spawn: (typeId, col, row, dir) => addEnemy(typeId, col, row, dir),
    placePlayer(col, row) { state.player.col = col; state.player.row = row; },
    setSafe(col, row, ms) { // setSafe(null, null, ms) = no safe cell for ms
      state.safeOn = true;
      if (col == null) { state.safe = null; state.safeT = ms; }
      else state.safe = { col, row, t: ms, dur: ms };
    },
  };

  return { state, handle, update, mode, stageFor, trackStages, trackLabel, debug };
})();


/* =====================================================================
 * 3. RENDER
 *    Draws Engine.state onto a fixed 320x200 canvas, scaled to fit.
 *    Read-only with respect to game state.
 * ===================================================================== */

const Render = (() => {
  const W = CONFIG.view.width, H = CONFIG.view.height, P = CONFIG.palette;
  const canvas = document.getElementById('screen');
  const footer = document.getElementById('footer');
  const ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;

  // Layout (derived from grid size so CONFIG.grid can change)
  const HEADER_H = 18, HUD_H = 22, MARGIN = 10;
  const cellW = Math.floor((W - 2 * MARGIN) / CONFIG.grid.cols);
  const cellH = Math.floor((H - HEADER_H - HUD_H - 4) / CONFIG.grid.rows);
  const gridX = Math.floor((W - cellW * CONFIG.grid.cols) / 2);
  const gridY = HEADER_H + 2;

  // ---- 5x7 bitmap font (original, each row is a 5-bit mask) ----
  const FONT = {
    '0':[14,17,19,21,25,17,14], '1':[4,12,4,4,4,4,14], '2':[14,17,1,2,4,8,31], '3':[31,2,4,2,1,17,14],
    '4':[2,6,10,18,31,2,2], '5':[31,16,30,1,1,17,14], '6':[6,8,16,30,17,17,14], '7':[31,1,2,4,8,8,8],
    '8':[14,17,17,14,17,17,14], '9':[14,17,17,15,1,2,12],
    'A':[14,17,17,31,17,17,17], 'B':[30,17,17,30,17,17,30], 'C':[14,17,16,16,16,17,14], 'D':[28,18,17,17,17,18,28],
    'E':[31,16,16,30,16,16,31], 'F':[31,16,16,30,16,16,16], 'G':[14,17,16,23,17,17,15], 'H':[17,17,17,31,17,17,17],
    'I':[14,4,4,4,4,4,14], 'J':[7,2,2,2,2,18,12], 'K':[17,18,20,24,20,18,17], 'L':[16,16,16,16,16,16,31],
    'M':[17,27,21,21,17,17,17], 'N':[17,17,25,21,19,17,17], 'O':[14,17,17,17,17,17,14], 'P':[30,17,17,30,16,16,16],
    'Q':[14,17,17,17,21,18,13], 'R':[30,17,17,30,20,18,17], 'S':[15,16,16,14,1,1,30], 'T':[31,4,4,4,4,4,4],
    'U':[17,17,17,17,17,17,14], 'V':[17,17,17,17,17,10,4], 'W':[17,17,17,21,21,21,10], 'X':[17,17,10,4,10,17,17],
    'Y':[17,17,10,4,4,4,4], 'Z':[31,1,2,4,8,16,31],
    ' ':[0,0,0,0,0,0,0], ':':[0,12,12,0,12,12,0], '.':[0,0,0,0,0,12,12], ',':[0,0,0,0,12,4,8],
    '-':[0,0,0,31,0,0,0], '+':[0,4,4,31,4,4,0], '=':[0,0,31,0,31,0,0], '!':[4,4,4,4,4,0,4],
    '?':[14,17,1,2,4,0,4], '/':[0,1,2,4,8,16,0], "'":[4,4,8,0,0,0,0], '(':[2,4,8,8,8,4,2],
    ')':[8,4,2,2,2,4,8], '·':[0,0,0,12,12,0,0], '×':[0,17,10,4,10,17,0],
    '−':[0,0,0,31,0,0,0], '÷':[0,4,0,31,0,4,0], '<':[2,4,8,16,8,4,2], '>':[8,4,2,1,2,4,8],
  };
  // Condensed 3x7 digits/operators (3-bit rows) for long cell text, e.g. "100÷10".
  // Same height as FONT, so a condensed cell lines up with its neighbours.
  const FONT_C = {
    '0':[7,5,5,5,5,5,7], '1':[2,6,2,2,2,2,7], '2':[7,1,1,7,4,4,7], '3':[7,1,1,7,1,1,7],
    '4':[5,5,5,7,1,1,1], '5':[7,4,4,7,1,1,7], '6':[7,4,4,7,5,5,7], '7':[7,1,1,2,2,2,2],
    '8':[7,5,5,7,5,5,7], '9':[7,5,5,7,1,1,7],
    '+':[0,0,2,7,2,0,0], '−':[0,0,0,7,0,0,0], '-':[0,0,0,7,0,0,0], '×':[0,0,5,2,5,0,0], '÷':[0,2,0,7,0,2,0],
  };
  const glyph = (ch, condensed) => condensed && FONT_C[ch]
    ? { g: FONT_C[ch], w: 3 } : { g: FONT[ch] || FONT['?'], w: 5 };
  function textWidth(str, scale = 1, condensed = false) {
    let w = 0;
    for (const ch of String(str).toUpperCase()) w += glyph(ch, condensed).w + 1;
    return w ? (w - 1) * scale : 0;
  }

  function text(str, x, y, color, scale = 1, align = 'left', condensed = false) {
    str = String(str).toUpperCase();
    if (align === 'center') x -= Math.floor(textWidth(str, scale, condensed) / 2);
    else if (align === 'right') x -= textWidth(str, scale, condensed);
    ctx.fillStyle = color;
    for (const ch of str) {
      const { g, w } = glyph(ch, condensed);
      for (let r = 0; r < 7; r++) {
        const bits = g[r];
        if (!bits) continue;
        for (let c = 0; c < w; c++) if (bits & (1 << (w - 1 - c))) ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
      }
      x += (w + 1) * scale;
    }
  }

  // Cell text rule (both sizes): up to 3 characters use the normal font; longer
  // strings (expressions, up to board.maxChars = 6) use the condensed font.
  // Big: scale 2, 3 chars = 35px, 6 condensed = 46px, inside a 48px cell.
  // Small (cell shared with a sprite): scale 1, top-left, on a dark plate.
  const condensedFor = str => String(str).length > 3;
  function cellText(str, x, y, color, scale, align) {
    text(str, x, y, color, scale, align, condensedFor(str));
  }

  // ---- Original creature sprite ("the chomper"), 14x12 ----
  // o outline · b body · w eye white · k pupil/mouth · t tooth
  const SPR_IDLE = [
    '....oooooo....',
    '..oobbbbbboo..',
    '.obbbbbbbbbbo.',
    '.obwwbbbbwwbo.',
    'obbwkbbbbwkbbo',
    'obbbbbbbbbbbbo',
    'obbkbbbbbbkbbo',
    'obbbkkkkkkbbbo',
    '.obbbbbbbbbbo.',
    '..oobbbbbboo..',
    '...ooo..ooo...',
  ];
  const SPR_CHOMP = [
    '....oooooo....',
    '..oobbbbbboo..',
    '.obwwbbbbwwbo.',
    'obbwkbbbbwkbbo',
    'obkkkkkkkkkkbo',
    'obktktktktktbo',
    'obkkkkkkkkkkbo',
    'obkkkkkkkkkkbo',
    'obbtktktktkbbo',
    '.obbkkkkkkbbo.',
    '..oobbbbbboo..',
    '...ooo..ooo...',
  ];
  const SPR_DEAD = [ // X-eyes, shocked mouth
    '....oooooo....',
    '..oobbbbbboo..',
    '.obkbkbbkbkbo.',
    '.obbkbbbbkbbo.',
    'obbkbkbbkbkbbo',
    'obbbbbbbbbbbbo',
    'obbbbbkkbbbbbo',
    'obbbbkbbkbbbbo',
    '.obbbbkkbbbbo.',
    '..oobbbbbboo..',
    '...ooo..ooo...',
  ];

  // ---- Original enemy sprite ("Grump"), 14x12, two-frame walk ----
  // Left half is mirrored; c = body (per type colour), brows slope inward, eyes glare inward.
  const mirror = half => half.map(h => h + [...h].reverse().join(''));
  const GRUMP_BODY = mirror([
    '...oooo',
    '..occcc',
    '.occccc',
    '.okkccc',
    'occkkcc',
    'occwkcc',
    'occcccc',
    'occkkkk',
    'occktkt',
    '.occccc',
    '..ooooo',
  ]);
  const GRUMP = [
    [...GRUMP_BODY, '.oo........oo.'], // feet apart
    [...GRUMP_BODY, '...oo....oo...'], // feet together (drawn 1px higher = waddle)
  ];
  const SAFE_ICON = ['.ooo.', 'ooooo', 'ooooo', '.ooo.', '..o..'];

  const creatureMap = hurt => ({ o: P.outline, b: hurt ? P.bodyHurt : P.body, w: P.eye, k: P.mouth, t: P.tooth });
  const grumpMap = color => ({ o: P.outline, c: color, w: P.eye, k: P.mouth, t: P.tooth });

  // rows: array of strings; map: char -> colour (unmapped chars are transparent)
  function sprite(rows, x, y, scale, map) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        const col = map[row[c]];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
      }
    }
  }

  function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
  function frame(x, y, w, h, color) {
    rect(x, y, w, 1, color); rect(x, y + h - 1, w, 1, color);
    rect(x, y, 1, h, color); rect(x + w - 1, y, 1, h, color);
  }
  function dim(alpha = 0.7) { ctx.fillStyle = `rgba(8,6,20,${alpha})`; ctx.fillRect(0, 0, W, H); }
  function banner(lines, color = P.accent, centreY = H / 2) {
    // lines: [{ s, scale, color }]
    const pad = 8;
    let h = pad, w = 0;
    for (const l of lines) { h += 7 * (l.scale || 1) + 5; w = Math.max(w, textWidth(l.s.toUpperCase(), l.scale || 1)); }
    h += pad - 5; w += pad * 2;
    const x = Math.floor((W - w) / 2), y = Math.floor(centreY - h / 2);
    rect(x, y, w, h, P.panel); frame(x, y, w, h, color);
    let yy = y + pad;
    for (const l of lines) { text(l.s, W / 2, yy, l.color || color, l.scale || 1, 'center'); yy += 7 * (l.scale || 1) + 5; }
  }

  // ---- screens ----
  function drawTitle(s, t) {
    rect(0, 0, W, H, P.bg);
    text(CONFIG.title, W / 2, 10, P.accent, 4, 'center');
    text('Eat the right numbers!', W / 2, 44, P.dim, 1, 'center');
    const bob = Math.round(Math.sin(t / 250) * 2);
    const chomping = Math.floor(t / 400) % 3 === 0;
    sprite(chomping ? SPR_CHOMP : SPR_IDLE, W / 2 - 14, 58 + bob, 2, creatureMap(false));
    const gf = Math.floor(t / 300) % 2;
    sprite(GRUMP[gf], W / 2 + 30, 60 - gf, 2, grumpMap(ENEMY_TYPES.wanderer.color));
    sprite(GRUMP[1 - gf], W / 2 - 58, 60 - (1 - gf), 2, grumpMap(ENEMY_TYPES.stalker.color));
    // menu
    CONFIG.menu.forEach((id, i) => {
      const y = 94 + i * 12, sel = i === s.menuIndex;
      if (sel) {
        rect(W / 2 - 100, y - 3, 200, 13, P.panel);
        text('>', W / 2 - 96, y, P.accent);
        text('<', W / 2 + 91, y, P.accent);
      }
      text(Engine.trackLabel(id), W / 2, y, sel ? P.accent : P.dim, 1, 'center');
    });
    if (Math.floor(t / 500) % 2 === 0) text('Up/Down choose   Space start', W / 2, 162, P.number, 1, 'center');
    text('Arrows/WASD move  Space eat  Esc pause', W / 2, 180, P.dim, 1, 'center');
  }

  function drawBoard(s, t) {
    rect(0, 0, W, H, P.bg);
    const m = Engine.mode();

    // header
    rect(0, 0, W, HEADER_H, P.panel);
    text(m.title(s.params), MARGIN, 6, P.accent);
    text('Stage ' + s.level, W - MARGIN, 6, P.number, 1, 'right');

    // grid
    const bad = s.flash && (s.flash.kind === 'bad' || s.flash.kind === 'dead');
    const occupied = new Set(s.enemies.map(e => e.row * CONFIG.grid.cols + e.col));
    occupied.add(s.player.row * CONFIG.grid.cols + s.player.col);
    const safeVisible = s.safe && (s.safe.t > CONFIG.safeCell.blinkBefore || Math.floor(s.safe.t / 150) % 2 === 0);
    const smallLabels = []; // drawn after the sprites so long expressions stay readable
    for (let r = 0; r < CONFIG.grid.rows; r++) {
      for (let c = 0; c < CONFIG.grid.cols; c++) {
        const i = r * CONFIG.grid.cols + c, cell = s.cells[i];
        const x = gridX + c * cellW, y = gridY + r * cellH;
        const flashing = s.flash && s.flash.cell === i;
        const safeHere = safeVisible && s.safe.col === c && s.safe.row === r;
        let fill = cell.eaten ? P.cellEaten : P.cell;
        if (safeHere) fill = P.safeFill;
        if (flashing && bad && Math.floor(s.flash.t / 120) % 2 === 0) fill = P.bad;
        if (flashing && s.flash.kind === 'good') fill = P.good;
        rect(x + 1, y + 1, cellW - 2, cellH - 2, fill);
        frame(x, y, cellW, cellH, P.cellEdge);
        if (safeHere) {
          frame(x + 2, y + 2, cellW - 4, cellH - 4, P.safeEdge);
          sprite(SAFE_ICON, x + cellW - 10, y + 3, 1, { o: P.safeEdge }); // rows y+3..7, clear of cell text at y+8
        }
        if (cell.fxT > 0) frame(x + 1, y + 1, cellW - 2, cellH - 2, P.rewrite);
        if (!cell.eaten) {
          if (occupied.has(i)) smallLabels.push({ str: cell.value, x: x + 4, y: y + 4 });
          else cellText(cell.value, x + cellW / 2, y + Math.floor((cellH - 14) / 2), P.number, 2, 'center');
        }
      }
    }
    frame(gridX - 1, gridY - 1, cellW * CONFIG.grid.cols + 2, cellH * CONFIG.grid.rows + 2, bad ? P.bad : P.cellEdge);

    // enemies (a Grump sharing the player's cell shifts left so both show)
    const sw = 14 * 2;
    for (const e of s.enemies) {
      const ex = gridX + e.col * cellW, ey = gridY + e.row * cellH;
      const f = Math.floor(e.animT / 250) % 2, spr = GRUMP[f];
      const withPlayer = e.col === s.player.col && e.row === s.player.row;
      const x = withPlayer ? ex + 3 : ex + cellW - sw - 3;
      sprite(spr, x, ey + cellH - spr.length * 2 - 1 - f, 2, grumpMap(ENEMY_TYPES[e.type].color));
    }

    // player
    const px = gridX + s.player.col * cellW, py = gridY + s.player.row * cellH;
    const dying = s.flash && s.flash.kind === 'dead';
    if (dying) {
      // shake with X-eyes, then blink out while floating up
      const k = 1 - s.flash.t / s.flash.dur;
      const shake = k < 0.6 ? (Math.floor(s.flash.t / 60) % 2 ? 1 : -1) : 0;
      const lift = k < 0.6 ? 0 : Math.round((k - 0.6) * 20);
      const show = k < 0.6 || Math.floor(s.flash.t / 80) % 2 === 0;
      if (show) sprite(SPR_DEAD, px + cellW - sw - 3 + shake, py + cellH - SPR_DEAD.length * 2 - 1 - lift, 2, creatureMap(true));
    } else {
      const spr = s.player.chompT > 0 ? SPR_CHOMP : SPR_IDLE;
      sprite(spr, px + cellW - sw - 3, py + cellH - spr.length * 2 - 1, 2, creatureMap(bad));
    }

    // numbers under the player / Grumps
    for (const l of smallLabels) {
      rect(l.x - 1, l.y - 1, textWidth(l.str, 1, condensedFor(l.str)) + 2, 9, P.panel);
      cellText(l.str, l.x, l.y, P.number, 1, 'left');
    }

    // "+points" pop
    if (s.flash && s.flash.kind === 'good') {
      const k = 1 - s.flash.t / s.flash.dur;
      const fc = s.flash.cell % CONFIG.grid.cols, fr = Math.floor(s.flash.cell / CONFIG.grid.cols);
      text(s.flash.msg, gridX + fc * cellW + cellW / 2, gridY + fr * cellH - Math.round(k * 10), P.good, 1, 'center');
    }

    // HUD
    const hudY = H - HUD_H;
    rect(0, hudY, W, HUD_H, P.panel);
    text('Score ' + String(s.score).padStart(5, '0'), MARGIN, hudY + 8, P.number);
    for (let i = 0; i < CONFIG.startLives; i++) {
      const x = W - MARGIN - 14 - i * 17;
      if (i < s.lives) sprite(SPR_IDLE, x, hudY + 5, 1, creatureMap(false));
      else frame(x + 3, hudY + 8, 8, 6, P.cellEdge);
    }

    // wrong-eat message
    if (dying) {
      // keep the death animation visible: banner goes in the half of the grid the player isn't in
      const top = s.player.row >= Math.floor(CONFIG.grid.rows / 2);
      banner([{ s: s.flash.msg, color: P.bad }], P.bad, gridY + cellH * (top ? 1 : CONFIG.grid.rows - 1));
    } else if (bad) banner([{ s: s.flash.msg, color: P.bad }], P.bad);
  }

  function draw(s, t) {
    switch (s.screen) {
      case 'title': drawTitle(s, t); break;
      case 'playing': drawBoard(s, t); break;
      case 'paused':
        drawBoard(s, t); dim();
        text('Paused', W / 2, 74, P.accent, 3, 'center');
        text('Esc or Space to resume', W / 2, 108, P.number, 1, 'center');
        break;
      case 'levelclear':
        drawBoard(s, t);
        banner([{ s: 'Stage clear!', scale: 2 }, { s: 'Bonus +' + s.lastBonus, color: P.number }]);
        break;
      case 'gameover':
        rect(0, 0, W, H, P.bg);
        text('Game over', W / 2, 40, P.bad, 3, 'center');
        text('Score ' + s.score, W / 2, 78, P.number, 2, 'center');
        text(Engine.trackLabel(s.track), W / 2, 104, P.dim, 1, 'center');
        text(`Stage ${s.level}: ${Engine.mode().title(s.params)}`, W / 2, 116, P.number, 1, 'center');
        if (s.screenT <= 0 && Math.floor(t / 500) % 2 === 0) text('Press Space', W / 2, 150, P.accent, 1, 'center');
        break;
    }
  }

  // Integer scaling for crisp pixels; fractional only if the window is tiny.
  function fit() {
    const availW = window.innerWidth - 8;
    const availH = window.innerHeight - footer.offsetHeight - 8;
    let s = Math.min(availW / W, availH / H);
    s = s >= 1 ? Math.floor(s) : s;
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
  }

  return { draw, fit, canvas };
})();


/* =====================================================================
 * 4. INPUT
 *    Physical input -> abstract actions -> Engine.handle(action).
 *    A touch layer can be added later by calling emit('up'), emit('eat'), ...
 * ===================================================================== */

const Input = (() => {
  const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    Space: 'eat',
    Enter: 'confirm', NumpadEnter: 'confirm',
    Escape: 'pause', KeyP: 'pause',
  };
  const REPEATABLE = new Set(['up', 'down', 'left', 'right']);

  function emit(action) { Engine.handle(action); }

  window.addEventListener('keydown', e => {
    const action = KEYMAP[e.code];
    if (!action) return;
    e.preventDefault();
    if (e.repeat && !REPEATABLE.has(action)) return;
    emit(action);
  });
  window.addEventListener('blur', () => emit('blur'));
  Render.canvas.addEventListener('pointerdown', () => Render.canvas.focus());

  return { emit };
})();


/* ---- boot + main loop ---- */
document.title = CONFIG.title;
window.Chompers = { CONFIG, MODES, MathUtil, ENEMY_TYPES, CAMPAIGN, Engine, Input };
window.addEventListener('resize', Render.fit);
Render.fit();
Render.canvas.focus();

let last = performance.now();
function frame(now) {
  const dt = Math.min(100, now - last);
  last = now;
  Engine.update(dt);
  Render.draw(Engine.state, now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
